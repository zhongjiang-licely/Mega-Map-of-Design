<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega-Map of Design (MMD)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        #root { min-height: 100vh; }
        /* 所有文字默认可选，可复制 */
        body, #root, .category-card-base {
            -webkit-user-select: text;
            user-select: text;
        }
        .layer-divider { border-top: 1px dashed #d1d5db; }
        .category-card-base {
            /* 双语版：英文两行加中文一行 */
            height: 44px;
            width: var(--card-w);
            flex-shrink: 0;
            position: relative;
        }
        :root {
            /* 卡片宽度固定，版面比例由整页等比缩放保证一致 */
            --card-w: 234px;
            /* 由脚本写入的整页缩放系数，供全屏浮层反算尺寸 */
            --scale: 1;
        }
        /* zoom 会一并缩放 fixed 元素，故全屏层按系数还原为整屏 */
        /* ---------- 检索栏 ---------- */
        .search-bar-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 8px auto;
        }
        .search-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            padding: 2px 6px 2px 8px;
        }
        .search-input-row:focus-within {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100,116,139,0.12);
        }
        .search-icon { font-size: 14px; color: #64748b; line-height: 1; }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 12px;
            padding: 4px 2px;
            background: transparent;
            color: #0f172a;
        }
        .search-clear {
            font-size: 14px;
            line-height: 1;
            color: #94a3b8;
            padding: 0 4px;
        }
        .search-clear:hover { color: #0f172a; }
        .search-fields-toggle,
        .search-go {
            font-size: 10.5px;
            font-weight: 600;
            border-radius: 7px;
            padding: 3px 8px;
            white-space: nowrap;
        }
        .search-fields-toggle {
            border: 1px solid #cbd5e1;
            color: #475569;
            background: #f8fafc;
        }
        .search-fields-toggle:hover { background: #f1f5f9; }
        .search-go {
            background: #0f172a;
            color: #fff;
        }
        .search-go:hover { background: #1e293b; }
        .search-count {
            position: absolute;
            right: 4px;
            top: 100%;
            margin-top: 2px;
            font-size: 10px;
            color: #64748b;
        }
        .search-popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 40;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(15,23,42,0.16);
            padding: 6px;
            max-height: 320px;
            overflow-y: auto;
            text-align: left;
        }
        .search-field-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #334155;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }
        .search-field-row:hover { background: #f1f5f9; }
        .search-field-note {
            font-size: 10px;
            color: #94a3b8;
            padding: 4px 6px 2px 6px;
        }
        .search-suggest-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            font-size: 11.5px;
            color: #0f172a;
            padding: 5px 6px;
            border-radius: 6px;
        }
        .search-suggest-row:hover,
        .search-suggest-row.is-active { background: #f1f5f9; }
        .search-suggest-dot {
            width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
        }
        .search-suggest-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .search-suggest-level { font-size: 10px; color: #94a3b8; flex-shrink: 0; }
        .search-mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }

        /* ---------- 结果面板 ---------- */
        .search-results {
            margin-top: 60px;
            width: 720px;
            max-width: 92vw;
            max-height: 76vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(15,23,42,0.35);
            overflow: hidden;
        }
        .search-results-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            color: #334155;
        }
        .search-results-close { font-size: 18px; line-height: 1; color: #94a3b8; }
        .search-results-close:hover { color: #0f172a; }
        .search-results-body { overflow-y: auto; padding: 8px 8px 16px 8px; }
        .search-group { margin-bottom: 10px; }
        .search-group-head {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 6px 8px 4px 8px;
        }
        .search-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 7px 8px;
            border-radius: 8px;
        }
        .search-row:hover { background: #f1f5f9; }
        .search-row-dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 4px; flex-shrink: 0; }
        .search-row-main { flex: 1; min-width: 0; }
        .search-row-path { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 1px; }
        .search-row-text { display: block; font-size: 11.5px; color: #0f172a; line-height: 1.5; }
        .search-row-level { font-size: 10px; color: #94a3b8; flex-shrink: 0; margin-top: 2px; }
        .search-more { font-size: 10px; color: #94a3b8; padding: 2px 8px 6px 8px; }
        .search-empty { font-size: 12px; color: #64748b; padding: 24px; text-align: center; }

        /* ---------- 首页命中高亮 ---------- */
        .card-dimmed { opacity: 0.18; filter: saturate(0.4); }
        .card-hit-badge {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            top: -5px;
            right: -5px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: #0f172a;
            color: #fff;
            font-size: 9.5px;
            font-weight: 700;
            line-height: 16px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(15,23,42,0.4);
        }

        .fullscreen-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(100vw / var(--scale));
            height: calc(100vh / var(--scale));
        }
        .grid-5-centered {
            display: grid;
            grid-template-columns: repeat(5, var(--card-w));
            gap: 16px;
            justify-content: center;
        }
        .grid-6-centered {
            display: grid;
            grid-template-columns: repeat(6, var(--card-w));
            gap: 16px;
            justify-content: center;
        }
        .main-container-width {
             max-width: 1700px;
             margin: 0 auto;
             padding: 0 20px;
        }
        .contact-drawer-overlay {
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }
        .contact-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: calc(100vh / var(--scale));
            width: 360px;
            max-width: 90vw;
            background-color: white;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.1);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 51;
        }
        .contact-drawer.is-open { transform: translateX(0); }

        .mmd-rainbow {
            display: inline-block;
            padding-right: 0.1em;
            background: linear-gradient(90deg,
               #deebf7, #bdd7ee, #7eb0de, #4e93d2, #2867A0, #2f5597,
               #203864, #548235, #91c46e, #b3d46a, #c2dd87, #d5e7ad,
               #fff2cc, #ffe699, #ffd653, #eeb500, #d76213, #ef8d4b,
               #f5b88f, #faddca, #ffabab, #e17171, #c04c4c, #b12568,
               #df639e, #e890ba, #f4c8dd, #e3cef2, #b888dc, #9b56ce,
               #7a33af
            );
            background-size: 200%;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
            font-style: italic;
            animation: rainbow-move 8s linear infinite;
        }
        @keyframes rainbow-move {
            0%   { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .mmd-gradient {
            display: inline-block;
            padding-right: 0.1em;
            background: linear-gradient(90deg,
                #deebf7, #bdd7ee, #7eb0de, #4e93d2, #2867A0, #2f5597,
                #203864, #548235, #91c46e, #b3d46a, #c2dd87, #d5e7ad,
                #fff2cc, #ffe699, #ffd653, #eeb500, #d76213, #ef8d4b,
                #f5b88f, #faddca, #ffabab, #e17171, #c04c4c, #b12568,
                #df639e, #e890ba, #f4c8dd, #e3cef2, #b888dc, #9b56ce,
                #7a33af
            );
           -webkit-background-clip: text;
           color: transparent;
           font-weight: 900;
           font-style: italic;
       }

       .term-panel-wrapper {
            clip-path: inset(0 0 0 100%);
            -webkit-clip-path: inset(0 0 0 100%);
       }
       .term-panel-enter {
            animation: term-panel-reveal 0.3s ease-out forwards;
       }
       .term-panel-exit {
            animation: term-panel-hide 0.3s ease-in forwards;
       }
       @keyframes term-panel-reveal {
            from {
                clip-path: inset(0 0 0 100%);
                -webkit-clip-path: inset(0 0 0 100%);
            }
            to {
                clip-path: inset(0 0 0 0);
                -webkit-clip-path: inset(0 0 0 0);
            }
       }
       @keyframes term-panel-hide {
            from {
                clip-path: inset(0 0 0 0);
                -webkit-clip-path: inset(0 0 0 0);
            }
            to {
                clip-path: inset(0 0 0 100%);
                -webkit-clip-path: inset(0 0 0 100%);
            }
       }

       /* More/Less 展开区域过渡 */
       .pu-expand-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out, opacity 0.3s ease-out;
            opacity: 0;
       }
       .pu-expand-section.is-expanded {
            max-height: 3000px;
            opacity: 1;
            transition: max-height 0.5s ease-in, opacity 0.3s ease-in;
       }


       /* ---------- Linked-term exploration ---------- */
       .linked-term-button {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 9px;
            transition: opacity 0.15s ease, transform 0.15s ease;
       }
       .linked-term-button:hover { opacity: 0.82; }
       .linked-term-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
       }
       .linked-term-tag {
            max-width: 160px;
            min-height: 24px;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.25;
            cursor: pointer;
            background: #f8fafc;
            color: #111827;
            box-shadow: 0 1px 2px rgba(15,23,42,0.08);
            border: 1px solid #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
       }
       .linked-term-tag:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
            box-shadow: 0 3px 7px rgba(15,23,42,0.12);
       }
       .linked-term-expanded {
            margin-top: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding: 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.38);
            border: 1px solid rgba(15,23,42,0.08);
       }
       .linked-term-expanded-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0.62;
            margin: 0 0 6px 2px;
       }
       .linked-term-preview-overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(15,23,42,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
       }
       .linked-term-preview-card {
            width: 440px;
            max-width: calc(100vw - 48px);
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            background: white;
            color: #0f172a;
            border-radius: 18px;
            box-shadow: 0 24px 64px rgba(15,23,42,0.36);
            border: 1px solid #e2e8f0;
       }
       .linked-term-preview-header {
            padding: 16px 18px 12px 18px;
            border-bottom: 1px solid #e2e8f0;
       }
       .linked-term-preview-body { padding: 14px 18px 16px 18px; }
       .linked-term-preview-path {
            font-size: 11px;
            color: #64748b;
            line-height: 1.45;
            margin-top: 5px;
       }
       .linked-term-preview-definition {
            font-size: 12.5px;
            color: #334155;
            line-height: 1.6;
            margin-top: 10px;
            white-space: pre-wrap;
       }
       .linked-term-preview-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
       }
       .linked-term-preview-pill {
            font-size: 10.5px;
            font-weight: 700;
            color: #475569;
            background: #f1f5f9;
            border-radius: 999px;
            padding: 3px 8px;
       }
       .linked-term-preview-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 18px 16px 18px;
            border-top: 1px solid #e2e8f0;
       }
       .history-panel {
            position: fixed;
            right: 16px;
            top: 92px;
            width: 220px;
            max-height: calc((100vh / var(--scale)) - 116px);
            overflow-y: auto;
            z-index: 45;
            background: rgba(255,255,255,0.96);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 14px 36px rgba(15,23,42,0.16);
            padding: 10px;
       }
       .history-title {
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            padding: 3px 2px 7px;
            margin-bottom: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #64748b;
            text-transform: uppercase;
            margin: 0 0 8px 2px;
       }
       .history-row {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            width: 100%;
            text-align: left;
            border-radius: 9px;
            padding: 6px;
            color: #0f172a;
       }
       .history-row:hover { background: #f1f5f9; }
       .history-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            flex-shrink: 0;
            margin-top: 4px;
       }
       .history-main { min-width: 0; flex: 1; }
       .history-term {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
       }
       .history-path {
            display: block;
            font-size: 9.5px;
            color: #94a3b8;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
       }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#64748b">
            <div style="width:42px;height:42px;border:4px solid #e2e8f0;border-top-color:#2867A0;border-radius:50%;animation:mmd-spin 0.8s linear infinite"></div>
            <div style="font-size:15px;letter-spacing:0.02em">Loading the Mega-Map of Design…</div>
        </div>
    </div>
    <style>@keyframes mmd-spin{to{transform:rotate(360deg)}}</style>

    <script type="text/babel">
        const { useMemo, useState, useEffect, useCallback } = React;


        const CLASSIC_GRADIENT_PALETTE_31 = [
            "#deebf7", "#bdd7ee", "#7eb0de", "#4e93d2", "#2867A0", "#2f5597",
            "#203864", "#548235", "#91c46e", "#b3d46a", "#c2dd87", "#d5e7ad",
            "#fff2cc", "#ffe699", "#ffd653", "#eeb500", "#d76213", "#ef8d4b",
            "#f5b88f", "#faddca", "#ffabab", "#e17171", "#c04c4c", "#b12568",
            "#df639e", "#e890ba", "#f4c8dd", "#e3cef2", "#b888dc", "#9b56ce",
            "#7a33af",
        ];

        function lightenHex(hex, amount = 20) {
            if (!hex) return hex;
            hex = hex.replace('#', '');
            if (hex.length !== 6) return '#' + hex;

            const num = parseInt(hex, 16);
            let r = (num >> 16) + amount;
            let g = ((num >> 8) & 0x00FF) + amount;
            let b = (num & 0x0000FF) + amount;

            r = Math.min(255, r);
            g = Math.min(255, g);
            b = Math.min(255, b);

            const newHex =
                '#' +
                r.toString(16).padStart(2, '0') +
                g.toString(16).padStart(2, '0') +
                b.toString(16).padStart(2, '0');

            return newHex;
        }

        function getTextColorForBackground(hex) {
          if (!hex) return '#111827';
          const c = hex.replace('#', '');
          if (c.length !== 6) return '#111827';
          const r = parseInt(c.slice(0, 2), 16);
          const g = parseInt(c.slice(2, 4), 16);
          const b = parseInt(c.slice(4, 6), 16);
          const brightness = (r * 299 + g * 587 + b * 114) / 1000;
          return brightness > 175 ? '#111827' : '#FFFFFF';
        }

        function hexToRgba(hex, alpha = 0.4) {
          if (!hex) return `rgba(0,0,0,${alpha})`;
          const c = hex.replace('#', '');
          if (c.length !== 6) return `rgba(0,0,0,${alpha})`;
          const r = parseInt(c.slice(0, 2), 16);
          const g = parseInt(c.slice(2, 4), 16);
          const b = parseInt(c.slice(4, 6), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        /* ============================================================
           整页等比缩放
           以下面的基准尺寸为准，页面按窗口大小整体放大或缩小，
           因此在任何显示器上看到的都是同一版面的等比缩放，比例不变。
           ============================================================ */
        const BASE_WIDTH = 1560;   // 网格 1484 加两侧留白
        const BASE_HEIGHT = 740;   // 顶部栏加网格总高（双语版卡片加高 18px × 13 行）
        const MIN_SCALE = 0.7;
        const MAX_SCALE = 1.25;

        function computeScale(w, h) {
          const raw = Math.min(w / BASE_WIDTH, h / BASE_HEIGHT);
          return Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(raw * 1000) / 1000));
        }

        const LIST_CATEGORY_HEIGHT = 88;
        const LIST_CATEGORY_ASPECT_RATIO = 2.4;

        /* ============================================================
           数据层
           页面启动时读取同目录下的 mmd.xlsx，因此改表即改内容。
           中文列（如「Category（中文）」）存在时按中英双语显示；
           缺失时自动退回英文，页面不会报错。
           更新 xlsx 后如需强制刷新缓存，把 DATA_VERSION 加一即可。
           ============================================================ */
        const DATA_FILE = "data/mmd.xlsx";
        /* 依次尝试的位置与写法：data 子目录优先，其次同目录；
           GitHub Pages 区分大小写，故一并试 MMD.xlsx */
        const DATA_DIRS = ["data/"];
        const DATA_NAMES = ["mmd.xlsx"];
        const DATA_CANDIDATES = DATA_DIRS.reduce(
          (list, dir) => list.concat(DATA_NAMES.map(name => dir + name)), []
        );
        const DATA_VERSION = "7";
        /* 下载后双击打开时为 file://，此时改为由用户手动选择数据文件 */
        const IS_LOCAL_FILE = !!(window.location && window.location.protocol === "file:");

        /* 表头归一化：忽略大小写、空格、下划线、BOM 与全半角括号 */
        function normaliseHeader(name) {
          return String(name || "")
            .replace(/^\uFEFF/, "")
            .replace(/[\s_（）()]/g, "")
            .toLowerCase();
        }

        const FIELD_BY_HEADER = {
          "group": "Group",
          "category": "Category",
          "subcategory": "Subcategory",
          "term": "Term",
          "subterm": "Subterm",
          "processingunit": "ProcessingUnit",
          "whatitis": "WhatItIs",
          "whatitisnot": "WhatItIsNot",
          "howitisused": "HowItIsUsed",
          "howitisstudied": "HowItIsStudied",
          "references": "References"
        };

        /* 需要向下填充的列（原表只在区块首行填值） */
        const CARRY_FIELDS = ["Group", "Category", "CategoryZh", "Subcategory", "SubcategoryZh", "Term", "TermZh"];

        /* 把一行原始数据映射为统一字段名，中文列加 Zh 后缀 */
        function mapRow(raw) {
          const row = {};
          Object.keys(raw).forEach(key => {
            const norm = normaliseHeader(key);
            const isZh = norm.indexOf("中文") !== -1;
            const base = FIELD_BY_HEADER[norm.replace("中文", "")];
            if (!base) return;
            const value = raw[key] === undefined || raw[key] === null ? "" : String(raw[key]).trim();
            if (!isZh) row[base] = value;
          });
          return row;
        }

        function normaliseRows(rawRows) {
          const carried = {};
          const rows = [];

          rawRows.forEach(raw => {
            const row = mapRow(raw);

            CARRY_FIELDS.forEach(field => {
              const value = row[field] || "";
              if (value === "") {
                row[field] = carried[field] || "";
              } else {
                carried[field] = value;
              }
            });

            // 只有破折号的 Subterm 视为空
            const onlyDashes = String(row.Subterm || "").replace(/[\s\u00A0\u200B]+/g, "");
            if (/^[-—–]*$/.test(onlyDashes)) {
              row.Subterm = "";
              row.SubtermZh = "";
            }

            // 四个描述列优先取中文，缺中文时退回英文；英文原文另存，供英文检索
            ["WhatItIs", "WhatItIsNot", "HowItIsUsed", "HowItIsStudied"].forEach(field => {
              row[field + "En"] = row[field] || "";
              row[field] = row[field] || "";
            });
            row.References = row.References || "";

            if (!row.Group || !row.Category || !row.Subcategory || !row.Term) return;
            rows.push(row);
          });

          return rows;
        }


        function keyPart(value) {
          return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
        }

        function makeTermKey(group, category, subcategory, term) {
          return [group, category, subcategory, term].map(keyPart).join("||");
        }

        function cleanExcelHeader(key) {
          return String(key || "").replace(/^\uFEFF/, "").trim().toLowerCase().replace(/[\s\-]+/g, "_");
        }

        function normaliseLinkRow(raw) {
          const r = {};
          Object.keys(raw || {}).forEach(key => { r[cleanExcelHeader(key)] = raw[key]; });
          const sourceGroup = String(r.source_group || "").trim();
          const sourceCategory = String(r.source_category || "").trim();
          const sourceSubCategory = String(r.source_sub_category || r.source_subcategory || "").trim();
          const sourceTerm = String(r.source_term || "").trim();
          const targetGroup = String(r.target_group || "").trim();
          const targetCategory = String(r.target_category || "").trim();
          const targetSubCategory = String(r.target_sub_category || r.target_subcategory || "").trim();
          const targetTerm = String(r.target_term || "").trim();
          const scoreRaw = r.recommendation_score;
          const score = scoreRaw === undefined || scoreRaw === null || scoreRaw === "" ? null : Number(scoreRaw);
          const rankRaw = r.rank;
          return {
            sourceId: String(r.source_id || "").trim(),
            sourceGroup, sourceCategory, sourceSubCategory, sourceTerm,
            sourceTermZh: String(r.source_term_zh || "").trim(),
            sourceKey: makeTermKey(sourceGroup, sourceCategory, sourceSubCategory, sourceTerm),
            rank: rankRaw === undefined || rankRaw === null || rankRaw === "" ? null : Number(rankRaw),
            orderStage: String(r.order_stage || r.recommendation_stage || "").trim(),
            recommendationStage: String(r.recommendation_stage || r.order_stage || "").trim(),
            isTopRecommendation: String(r.is_top_recommendation || "").toLowerCase() === "true",
            recommendationScore: Number.isFinite(score) ? score : null,
            strength: String(r.strength || "").trim(),
            hierarchicalDistance: String(r.hierarchical_distance || "").trim(),
            targetId: String(r.target_id || "").trim(),
            targetGroup, targetCategory, targetSubCategory, targetTerm,
            targetTermZh: String(r.target_term_zh || "").trim(),
            targetKey: makeTermKey(targetGroup, targetCategory, targetSubCategory, targetTerm),
            linkId: String(r.link_id || "").trim(),
            pairId: String(r.pair_id || "").trim(),
            types: String(r.types || "").trim(),
            directions: String(r.directions || "").trim(),
            justification: String(r.justification || "").trim()
          };
        }

        /* 首屏只解析轻量工作表；all_linked_terms_ordered 仅在用户点击顶部按钮后由 Web Worker 解析。 */
        /* Large MMD workbooks contain more than 500,000 full-link rows.
           SheetJS would otherwise process the large ZIP on the UI thread even
           when the requested workbook sheets are only the small first two.
           Extract just the initial sheets into a temporary in-memory workbook. */
        async function parseInitialWorkbook(arrayBuffer) {
          if (!window.XLSX) throw new Error("SheetJS not loaded. Check your internet connection.");
          if (!window.JSZip) throw new Error("JSZip not loaded. Check your internet connection.");
          const archive = await JSZip.loadAsync(arrayBuffer);
          const primary = archive.file("xl/worksheets/sheet1.xml");
          const suggestions = archive.file("xl/worksheets/sheet3.xml");
          if (!primary) throw new Error("Missing mmd_data sheet");
          const mini = new JSZip();
          mini.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`);
          mini.file("_rels/.rels", `<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
          mini.file("xl/workbook.xml", `<?xml version="1.0"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="mmd_data" sheetId="1" r:id="rId1"/><sheet name="recommended_links" sheetId="2" r:id="rId2"/></sheets></workbook>`);
          mini.file("xl/_rels/workbook.xml.rels", `<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/></Relationships>`);
          mini.file("xl/worksheets/sheet1.xml", await primary.async("uint8array"));
          if (suggestions) mini.file("xl/worksheets/sheet2.xml", await suggestions.async("uint8array"));
          const lightweightBuffer = await mini.generateAsync({ type: "arraybuffer", compression: "STORE" });
          const workbook = XLSX.read(lightweightBuffer, { type: "array", sheets: ["mmd_data", "recommended_links"] });
          const mmdSheet = workbook.Sheets["mmd_data"];
          if (!mmdSheet) throw new Error("mmd_data sheet not found");
          const rows = normaliseRows(XLSX.utils.sheet_to_json(mmdSheet, { defval: "" }));
          const recommendationSheet = workbook.Sheets["recommended_links"];
          const recommendedLinks = recommendationSheet
            ? XLSX.utils.sheet_to_json(recommendationSheet, { defval: "" }).map(normaliseLinkRow).filter(r => r.sourceTerm && r.targetTerm)
            : [];
          return { rows, recommendedLinks };
        }

        /* Stream only sheet4.xml inside the XLSX ZIP. Do not materialise the 669 MB
           worksheet or run XLSX.read on the full workbook. */
        function createAllLinksWorker() {
          if (typeof Worker === "undefined" || typeof Blob === "undefined" || !window.URL || !URL.createObjectURL) return null;
          const workerCode = String.raw`
            const FFLATE_URL = "https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js";
            let total = 0;
            let batch = [];
            let headers = {};
            let pending = "";
            let completed = false;
            const utf8 = new TextDecoder("utf-8");
            const entityMap = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'" };
            function unescapeXML(s) {
              return String(s || "").replace(/&(#x[0-9a-f]+|#[0-9]+|amp|lt|gt|quot|apos);/gi, (raw, key) => {
                if (key[0] === '#') {
                  const n = key[1].toLowerCase() === 'x' ? parseInt(key.slice(2), 16) : parseInt(key.slice(1), 10);
                  return Number.isFinite(n) && n > 0 && n <= 1114111 ? String.fromCodePoint(n) : raw;
                }
                return entityMap[key.toLowerCase()] || raw;
              });
            }
            function keyPart(s) { return String(s || "").replace(/\s+/g, " ").trim().toLowerCase(); }
            function makeKey(g,c,s,t) { return [g,c,s,t].map(keyPart).join("||"); }
            function flush() {
              if (batch.length) { self.postMessage({type:"batch", links:batch}); batch=[]; }
            }
            function parseRow(xml) {
              const cells = {};
              const cellRe = /<c\b([^>]*)>([\s\S]*?)<\/c>/g;
              let cm;
              while ((cm=cellRe.exec(xml))!==null) {
                const ref = /\br="([A-Z]+)[0-9]+"/.exec(cm[1]);
                if (!ref) continue;
                const col=ref[1], content=cm[2];
                const t=/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/.exec(content);
                const v=t ? t[1] : ((/<v>([\s\S]*?)<\/v>/.exec(content)||[])[1]||"");
                cells[col]=unescapeXML(v);
              }
              if (!Object.keys(headers).length) {
                for (const [col,val] of Object.entries(cells)) headers[col]=val.trim();
                if (!Object.values(headers).includes("source_term") || !Object.values(headers).includes("target_term")) throw new Error("Unexpected column headers in all_linked_terms_ordered");
                return;
              }
              const r={};
              for (const [col,val] of Object.entries(cells)) if (headers[col]) r[headers[col]]=val;
              if (!r.source_term || !r.target_term) return;
              const sourceKey=makeKey(r.source_group,r.source_category,r.source_sub_category,r.source_term);
              const targetKey=makeKey(r.target_group,r.target_category,r.target_sub_category,r.target_term);
              batch.push({sourceKey,targetKey,targetGroup:r.target_group||"",targetCategory:r.target_category||"",targetSubCategory:r.target_sub_category||"",targetTerm:r.target_term||"",rank:Number(r.rank)||null,linkId:r.link_id||"",targetTermZh:r.target_term_zh||""});
              total++;
              if (batch.length>=5000) flush();
              if (total%25000===0) self.postMessage({type:"progress",count:total});
            }
            function acceptChunk(bytes, final) {
              pending += utf8.decode(bytes,{stream:!final});
              let start=0;
              for (;;) {
                const a=pending.indexOf("<row ",start);
                const b=pending.indexOf("<row>",start);
                const rowStart=a<0?b:b<0?a:Math.min(a,b);
                if (rowStart<0) { pending=pending.slice(Math.max(0,pending.length-128)); break; }
                const end=pending.indexOf("</row>",rowStart);
                if (end<0) { pending=pending.slice(rowStart); break; }
                parseRow(pending.slice(rowStart,end+6));
                start=end+6;
              }
              if (final && !completed) { completed=true; flush(); self.postMessage({type:"done",count:total}); }
            }
            self.onmessage = (event) => {
              try {
                importScripts(FFLATE_URL);
                if (!self.fflate || !self.fflate.Unzip) throw new Error("Streaming ZIP library unavailable");
                let found=false;
                const unzip=new fflate.Unzip(file => {
                  if (file.name!=="xl/worksheets/sheet4.xml") {file.ondata=()=>{}; return;}
                  found=true;
                  file.ondata=(err,data,final)=>{
                    if(err){ self.postMessage({type:"error",message:String(err)});return; }
                    try {acceptChunk(data,final);}catch(e){self.postMessage({type:"error",message:String(e.message||e)});}
                  };
                  file.start();
                });
                unzip.register(fflate.AsyncUnzipInflate);
                const bytes=new Uint8Array(event.data.arrayBuffer);
                // Split input to keep the stream responsive and limit working allocations.
                const STEP=1024*1024;
                for(let i=0;i<bytes.length;i+=STEP) unzip.push(bytes.subarray(i,Math.min(i+STEP,bytes.length)),i+STEP>=bytes.length);
                if (!found) self.postMessage({type:"error",message:"all_linked_terms_ordered worksheet not found"});
              } catch (err) {self.postMessage({type:"error",message:err&&err.message?err.message:String(err)});}
            };
          `;
          const blobUrl=URL.createObjectURL(new Blob([workerCode],{type:"application/javascript"}));
          const worker=new Worker(blobUrl);
          worker.addEventListener("message",e=>{if(e.data&&["done","error"].includes(e.data.type)) URL.revokeObjectURL(blobUrl);});
          worker.addEventListener("error",()=>URL.revokeObjectURL(blobUrl),{once:true});
          return worker;
        }

        /* 把「英文；英文」与「中文；中文」按序配对；数量不一致时整体配对 */
        function pairBilingualList(en, zh) {
          const splitList = (s) => String(s || "").split(/[;；]/).map(x => x.trim()).filter(Boolean);
          const enList = splitList(en);
          const zhList = splitList(zh);
          if (!enList.length) return [];
          if (!zhList.length) return enList.map(e => ({ en: e, zh: "" }));
          if (zhList.length === enList.length) {
            return enList.map((e, i) => ({ en: e, zh: zhList[i] }));
          }
          return [{ en: String(en || "").trim(), zh: String(zh || "").trim() }];
        }

        /* ============================================================
           检索
           字段：Category / Sub-category / Term / Definition /
                 Clarification / References
           匹配：忽略大小写、连字符、变音符与 & ；-ise 与 -ize、
                 单复数视为同一形式；全无结果时再放宽一个字符的拼写偏差
           ============================================================ */
        const SEARCH_FIELDS = [
          { key: "category",      label: "Category" },
          { key: "subcategory",   label: "Sub-category" },
          { key: "term",          label: "Term" },
          { key: "definition",    label: "Definition" },
          { key: "clarification", label: "Clarification" }
        ];

        const DEFAULT_FIELDS = {
          category: true, subcategory: true, term: true,
          definition: true, clarification: false
        };

        const FIELD_WEIGHT = {
          category: 0, subcategory: 1, term: 2,
          definition: 3, clarification: 4
        };

        function stemToken(token) {
          let t = token;
          t = t.replace(/isation$/, "ization")
               .replace(/ising$/, "izing")
               .replace(/ised$/, "ized")
               .replace(/ise$/, "ize")
               .replace(/yse$/, "yze");
          if (t.length > 3 && t.endsWith("s") && !t.endsWith("ss")) t = t.slice(0, -1);
          return t;
        }

        function splitWords(value) {
          return String(value || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/&/g, " and ")
            .replace(/[^a-z0-9]+/g, " ")
            .trim()
            .split(" ")
            .filter(Boolean);
        }

        function normaliseForSearch(value) {
          return " " + splitWords(value).map(stemToken).join(" ") + " ";
        }

        /* 编辑距离是否不超过 1 */
        function withinOneEdit(a, b) {
          if (a === b) return true;
          const la = a.length, lb = b.length;
          if (Math.abs(la - lb) > 1) return false;
          let i = 0, j = 0, edits = 0;
          while (i < la && j < lb) {
            if (a[i] === b[j]) { i++; j++; continue; }
            if (++edits > 1) return false;
            if (la > lb) i++;
            else if (lb > la) j++;
            else { i++; j++; }
          }
          return true;
        }

        function buildSearchIndex(flatCategories) {
          const entries = [];
          const add = (entry) => {
            if (!entry.text) return;
            entry.norm = normaliseForSearch(entry.text);
            entry.id = entries.length;
            entries.push(entry);
          };

          flatCategories.forEach((c) => {
            add({ field: "category", level: "Category", text: c.name, zh: c.nameZh, ci: c.ci, subIdx: null, term: null, catName: c.name, subName: null, color: c.color });

            c.subs.forEach((s, si) => {
              add({ field: "subcategory", level: "Sub-category", text: s.label, zh: s.labelZh, ci: c.ci, subIdx: si, term: null, catName: c.name, subName: s.label, color: c.color });

              s.items.forEach((it) => {
                const base = { ci: c.ci, subIdx: si, term: it.term, termKey: it.termKey || makeTermKey(c.group, c.name, s.label, it.term), catName: c.name, subName: s.label, color: c.color };
                add(Object.assign({ field: "term", level: "Term", text: it.term, zh: it.termZh }, base));

                (it.subterms || []).forEach((st) => {
                  add(Object.assign({ field: "term", level: "Subterm", text: st.en, zh: st.zh }, base));
                });

                (it.processingUnits || []).forEach((pu) => {
                  if (pu.name && pu.name !== it.term) {
                    add(Object.assign({ field: "term", level: "Processing Unit", text: pu.name, zh: pu.nameZh }, base));
                  }
                  /* 描述列：页面显示中文，英文原文保留在 text 中供英文检索 */
                  add(Object.assign({ field: "definition", level: "Definition", text: pu.whatItIsEn || pu.whatItIs, zh: pu.whatItIs }, base));
                  const clarification = [pu.whatItIsNot, pu.howItIsUsed, pu.howItIsStudied].filter(Boolean).join("\n");
                  add(Object.assign({ field: "clarification", level: "Clarification", text: pu.clarificationEn || clarification, zh: clarification }, base));
                });
              });
            });
          });

          return entries;
        }

        /* 打分：越小越靠前 */
        function scoreEntry(entry, phrase) {
          const norm = entry.norm;
          let quality = 3;
          if (norm === phrase + " ") quality = 0;
          else if (norm.indexOf(phrase) === 0) quality = 1;
          else if (norm.indexOf(phrase) !== -1) quality = 2;
          return quality * 10 + (FIELD_WEIGHT[entry.field] || 0) + Math.min(4, entry.text.length / 400);
        }

        /* 中文检索：查询含汉字时，在中文文本中按子串匹配 */
        const CJK_RE = /[\u3400-\u9fff\uf900-\ufaff]/;
        function isCjkQuery(q) { return CJK_RE.test(String(q || "")); }
        function cjkWords(q) {
          return String(q || "").split(/[\s,，;；、]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
        }
        /* 条目在当前查询语言下显示的文本 */
        function entryText(entry, query) {
          return isCjkQuery(query) && entry.zh ? entry.zh : entry.text;
        }
        function queryWords(q) { return isCjkQuery(q) ? cjkWords(q) : splitWords(q); }

        function runCjkSearch(index, rawQuery, fields, limit) {
          const words = cjkWords(rawQuery);
          if (!words.length) return [];
          const phrase = words.join("");
          const wanted = index.filter(e => fields[e.field] && e.zh);
          const lower = (e) => e.zh.toLowerCase();
          let hits = wanted.filter(e => lower(e).replace(/\s+/g, "").indexOf(phrase) !== -1);
          if (!hits.length) hits = wanted.filter(e => words.every(w => lower(e).indexOf(w) !== -1));
          const score = (e) => {
            const z = lower(e);
            const q = z === phrase ? 0 : z.indexOf(phrase) === 0 ? 1 : 2;
            return q * 10 + (FIELD_WEIGHT[e.field] || 0) + Math.min(4, e.zh.length / 200);
          };
          hits.sort((a, b) => score(a) - score(b) || a.id - b.id);
          return limit ? hits.slice(0, limit) : hits;
        }

        function runSearch(index, rawQuery, fields, limit) {
          if (isCjkQuery(rawQuery)) return runCjkSearch(index, rawQuery, fields, limit);
          const stems = splitWords(rawQuery).map(stemToken);
          if (!stems.length) return [];

          const wanted = index.filter(e => fields[e.field]);
          const phrase = " " + stems.join(" ");

          /* 一，整串相邻匹配，例如 co-design 只命中 Co-Design 一类 */
          let hits = wanted.filter(e => e.norm.indexOf(phrase) !== -1);

          /* 二，退而求其次，各词分散出现即可，词首对齐以免 co 命中 concept */
          if (!hits.length) {
            hits = wanted.filter(e => stems.every(t => e.norm.indexOf(" " + t) !== -1));
          }

          /* 三，仍无结果时放宽一个字符的拼写偏差 */
          if (!hits.length) {
            hits = wanted.filter((entry) => {
              const words = entry.norm.trim().split(" ");
              return stems.every(t => words.some(w => withinOneEdit(w, t)));
            });
          }

          hits.sort((a, b) => scoreEntry(a, phrase) - scoreEntry(b, phrase) || a.id - b.id);
          return limit ? hits.slice(0, limit) : hits;
        }

        /* 把命中的关键词标出来，并在长文本中截取上下文 */
        function highlightParts(text, words, contextLength) {
          const source = String(text || "");
          const lower = source.toLowerCase();
          const ranges = [];
          words.forEach((w) => {
            if (!w) return;
            let i = lower.indexOf(w);
            while (i !== -1) {
              ranges.push([i, i + w.length]);
              i = lower.indexOf(w, i + w.length);
            }
          });
          ranges.sort((a, b) => a[0] - b[0]);

          const merged = [];
          ranges.forEach((r) => {
            const last = merged[merged.length - 1];
            if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
            else merged.push(r.slice());
          });

          let start = 0, end = source.length, prefix = "", suffix = "";
          if (contextLength && source.length > contextLength) {
            const anchor = merged.length ? merged[0][0] : 0;
            start = Math.max(0, anchor - Math.floor(contextLength / 3));
            end = Math.min(source.length, start + contextLength);
            if (start > 0) prefix = "… ";
            if (end < source.length) suffix = " …";
          }

          const nodes = [];
          let cursor = start;
          merged.forEach(([a, b], k) => {
            if (b <= start || a >= end) return;
            const from = Math.max(a, start), to = Math.min(b, end);
            if (from > cursor) nodes.push(source.slice(cursor, from));
            nodes.push(<mark key={k} className="search-mark">{source.slice(from, to)}</mark>);
            cursor = to;
          });
          if (cursor < end) nodes.push(source.slice(cursor, end));

          return [prefix, ...nodes, suffix];
        }

        /* ============================================================
           buildStructure — 单层结构：Category 按原表顺序平铺
           颜色仍按 Group 依次取自 31 色渐变色板
           ============================================================ */
        function buildStructure(rows) {
          const flatCategories = [];
          let currentGroup = "";
          let colorIndex = -1;
          let currentColor = CLASSIC_GRADIENT_PALETTE_31[0];

          rows.forEach((row, idx) => {
            if (row.Group !== currentGroup) {
              currentGroup = row.Group;
              colorIndex = (colorIndex + 1) % CLASSIC_GRADIENT_PALETTE_31.length;
              currentColor = CLASSIC_GRADIENT_PALETTE_31[colorIndex];
            }

            let cat = flatCategories.find(c => c.name === row.Category && c.group === currentGroup);
            if (!cat) {
              cat = {
                key: `${idx}-${row.Category}`,
                name: row.Category,
                nameZh: row.CategoryZh,
                color: currentColor,
                group: currentGroup,
                subs: [],
                ci: flatCategories.length
              };
              flatCategories.push(cat);
            }

            let sc = cat.subs.find(s => s.label === row.Subcategory);
            if (!sc) {
              sc = { label: row.Subcategory, labelZh: row.SubcategoryZh, color: cat.color, items: [] };
              cat.subs.push(sc);
            }

            let item = sc.items.find(it => it.term === row.Term);
            if (!item) {
              item = {
                term: row.Term,
                termZh: row.TermZh,
                group: currentGroup,
                category: row.Category,
                subcategory: row.Subcategory,
                termKey: makeTermKey(currentGroup, row.Category, row.Subcategory, row.Term),
                subterms: [],
                processingUnits: []
              };
              sc.items.push(item);
            }

            if (row.Subterm) {
              pairBilingualList(row.Subterm, row.SubtermZh).forEach(pair => {
                if (!item.subterms.some(s => s.en === pair.en)) item.subterms.push(pair);
              });
            }

            if (row.ProcessingUnit && !item.processingUnits.some(pu => pu.name === row.ProcessingUnit)) {
              item.processingUnits.push({
                name: row.ProcessingUnit,
                nameZh: row.ProcessingUnitZh,
                whatItIs: row.WhatItIs || '',
                whatItIsNot: row.WhatItIsNot || '',
                howItIsUsed: row.HowItIsUsed || '',
                howItIsStudied: row.HowItIsStudied || '',
                whatItIsEn: row.WhatItIsEn || '',
                clarificationEn: [row.WhatItIsNotEn, row.HowItIsUsedEn, row.HowItIsStudiedEn].filter(Boolean).join("\n"),
                references: row.References || ''
              });
            }
          });

          return { flatCategories };
        }

        function useParsedData(rows) {
          return useMemo(() => {
            if (!rows || !rows.length) return { flatCategories: [], count: 0 };
            const { flatCategories } = buildStructure(rows);
            console.log("Parsed categories:", flatCategories.length);
            return { flatCategories, count: flatCategories.length };
          }, [rows]);
        }

        /* 划选文字后不应触发点击：记录按下位置，移动超过 4px
           或松开时存在选区，就把这次点击视为选字而非点击 */
        let pointerDownAt = null;
        function markPointerDown(e) {
          pointerDownAt = { x: e.clientX, y: e.clientY };
        }
        function isDragOrSelection(e) {
          const from = pointerDownAt;
          pointerDownAt = null;
          if (from && (Math.abs(e.clientX - from.x) > 4 || Math.abs(e.clientY - from.y) > 4)) return true;
          const sel = window.getSelection ? window.getSelection() : null;
          return !!(sel && !sel.isCollapsed && String(sel).length > 0);
        }

        /* 双语版：Sub-category 方块内英文加中文放不下时，整体等比缩小直至放下（最小 0.72） */
        const FitBox = ({ className, children }) => {
          const ref = React.useRef(null);
          React.useLayoutEffect(() => {
            const el = ref.current;
            if (!el || !el.parentElement) return;
            el.style.zoom = 1;
            const box = el.parentElement;
            for (let k = 0; k < 4; k++) {
              const avail = box.clientHeight;
              const need = el.offsetHeight * (parseFloat(el.style.zoom) || 1);
              if (need <= avail) break;
              const z = Math.max(0.72, (parseFloat(el.style.zoom) || 1) * avail / need * 0.98);
              el.style.zoom = z;
            }
          });
          return <div ref={ref} className={className}>{children}</div>;
        };

        /* 首页卡片的中文名默认 14px；过长时按卡片内宽缩小字号，保证一行放下 */
        function fitZhCardSize(zh) {
          const len = String(zh || "").length;
          if (len <= 14) return "14px";
          return Math.max(11, Math.floor(186 / len * 10) / 10) + "px";

        function getFixedPositionsRect(centerW, centerH) {
          const subH = Math.round(centerH * 0.68);
          const subW = Math.round(centerW * 0.68);

          const maxSlots = 13;
          const positions = [];

          const margin = 20;

          const baseRadiusX = centerW / 2 + subW / 2 + margin;
          const baseRadiusY = centerH / 2 + subH / 2 + margin;

          const radiusScaleX = 1.5;
          const radiusScaleY = 2.0;

          const radiusX = baseRadiusX * radiusScaleX;
          const radiusY = baseRadiusY * radiusScaleY;

          const step = (2 * Math.PI) / maxSlots;
          const offsetFactor = 0.37;
          const angleOffset = step * offsetFactor;

          for (let i = 0; i < maxSlots; i++) {
            const angle = -Math.PI / 2 + angleOffset + step * i;
            const x = Math.round(Math.cos(angle) * radiusX);
            const y = Math.round(Math.sin(angle) * radiusY);
            positions.push({ x, y });
          }

          return { positions, subW, subH };
        }

        /* ============================================================

          const handleKey = (e) => {
            if (e.key === "ArrowDown") {
              e.preventDefault();
              setShowSuggest(true);
              setCursor(c => Math.min(c + 1, suggestions.length - 1));
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              setCursor(c => Math.max(c - 1, -1));
            } else if (e.key === "Enter") {
              if (cursor >= 0 && suggestions[cursor]) {
                onPick(suggestions[cursor]);
                setShowSuggest(false);
              } else {
                onSubmit();
                setShowSuggest(false);
              }
            } else if (e.key === "Escape") {

        const HistoryPanel = ({ items, onPick }) => {
          const panelRef = React.useRef(null);
          const dragRef = React.useRef(null);

          const onDragStart = (e) => {
            if (e.button !== 0 && e.pointerType === "mouse") return;
            const panel = panelRef.current;
            if (!panel) return;
            const zoom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--scale")) || 1;
            const bounds = panel.getBoundingClientRect();
            dragRef.current = {
              pointerId: e.pointerId,
              startX: e.clientX,
              startY: e.clientY,
              left: bounds.left / zoom,
              top: bounds.top / zoom,
              zoom
            };
            panel.style.left = `${bounds.left / zoom}px`;
            panel.style.top = `${bounds.top / zoom}px`;
            panel.style.right = "auto";
            e.currentTarget.setPointerCapture(e.pointerId);
            e.currentTarget.style.cursor = "grabbing";
            e.preventDefault();
          };
          const onDragMove = (e) => {
            const drag = dragRef.current;
            const panel = panelRef.current;
            if (!drag || !panel || e.pointerId !== drag.pointerId) return;
            const zoom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--scale")) || drag.zoom;
            const width = panel.offsetWidth;
            const height = panel.offsetHeight;
            const maxLeft = Math.max(0, window.innerWidth / zoom - width);
            const maxTop = Math.max(0, window.innerHeight / zoom - height);
            const left = drag.left + (e.clientX - drag.startX) / zoom;
            const top = drag.top + (e.clientY - drag.startY) / zoom;
            panel.style.left = `${Math.min(maxLeft, Math.max(0, left))}px`;
            panel.style.top = `${Math.min(maxTop, Math.max(0, top))}px`;
          };
          const onDragEnd = (e) => {
            if (!dragRef.current || e.pointerId !== dragRef.current.pointerId) return;
            dragRef.current = null;
            e.currentTarget.style.cursor = "";
            if (e.currentTarget.hasPointerCapture(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
          };

          if (!items || !items.length) return null;
          return (
            <div ref={panelRef} className="history-panel" onClick={(e) => e.stopPropagation()}>
              <div className="history-title" title="Drag to move History panel"
                   onPointerDown={onDragStart} onPointerMove={onDragMove}
                   onPointerUp={onDragEnd} onPointerCancel={onDragEnd}>History <span style={{float: "right", fontSize: "13px", lineHeight: "10px", opacity: 0.6}}>⠿</span></div>
