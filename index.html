<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega-Map of Design (MMD)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        #root { min-height: 100vh; }
        .layer-divider { border-top: 1px dashed #d1d5db; }
        .category-card-base {
            height: 44px;
            width: var(--card-w);
            flex-shrink: 0;
            position: relative;
        }
        :root {
            /* 卡片宽度固定，版面比例由整页等比缩放保证一致 */
            --card-w: 234px;
            /* 由脚本写入的整页缩放系数，供全屏浮层反算尺寸 */
            --scale: 1;
        }
        /* zoom 会一并缩放 fixed 元素，故全屏层按系数还原为整屏 */
        /* ---------- 检索栏 ---------- */
        .search-bar-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 8px auto;
        }
        .search-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            padding: 2px 6px 2px 8px;
        }
        .search-input-row:focus-within {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100,116,139,0.12);
        }
        .search-icon { font-size: 14px; color: #64748b; line-height: 1; }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 12px;
            padding: 4px 2px;
            background: transparent;
            color: #0f172a;
        }
        .search-clear {
            font-size: 14px;
            line-height: 1;
            color: #94a3b8;
            padding: 0 4px;
        }
        .search-clear:hover { color: #0f172a; }
        .search-fields-toggle,
        .search-go {
            font-size: 10.5px;
            font-weight: 600;
            border-radius: 7px;
            padding: 3px 8px;
            white-space: nowrap;
        }
        .search-fields-toggle {
            border: 1px solid #cbd5e1;
            color: #475569;
            background: #f8fafc;
        }
        .search-fields-toggle:hover { background: #f1f5f9; }
        .search-go {
            background: #0f172a;
            color: #fff;
        }
        .search-go:hover { background: #1e293b; }
        .search-count {
            position: absolute;
            right: 4px;
            top: 100%;
            margin-top: 2px;
            font-size: 10px;
            color: #64748b;
        }
        .search-popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 40;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(15,23,42,0.16);
            padding: 6px;
            max-height: 320px;
            overflow-y: auto;
            text-align: left;
        }
        .search-field-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #334155;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }
        .search-field-row:hover { background: #f1f5f9; }
        .search-field-note {
            font-size: 10px;
            color: #94a3b8;
            padding: 4px 6px 2px 6px;
        }
        .search-suggest-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            font-size: 11.5px;
            color: #0f172a;
            padding: 5px 6px;
            border-radius: 6px;
        }
        .search-suggest-row:hover,
        .search-suggest-row.is-active { background: #f1f5f9; }
        .search-suggest-dot {
            width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
        }
        .search-suggest-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .search-suggest-level { font-size: 10px; color: #94a3b8; flex-shrink: 0; }
        .search-mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }

        /* ---------- 结果面板 ---------- */
        .search-results {
            margin-top: 60px;
            width: 720px;
            max-width: 92vw;
            max-height: 76vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(15,23,42,0.35);
            overflow: hidden;
        }
        .search-results-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 12px;
            color: #334155;
        }
        .search-results-close { font-size: 18px; line-height: 1; color: #94a3b8; }
        .search-results-close:hover { color: #0f172a; }
        .search-results-body { overflow-y: auto; padding: 8px 8px 16px 8px; }
        .search-group { margin-bottom: 10px; }
        .search-group-head {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 6px 8px 4px 8px;
        }
        .search-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 7px 8px;
            border-radius: 8px;
        }
        .search-row:hover { background: #f1f5f9; }
        .search-row-dot { width: 8px; height: 8px; border-radius: 999px; margin-top: 4px; flex-shrink: 0; }
        .search-row-main { flex: 1; min-width: 0; }
        .search-row-path { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 1px; }
        .search-row-text { display: block; font-size: 11.5px; color: #0f172a; line-height: 1.5; }
        .search-row-level { font-size: 10px; color: #94a3b8; flex-shrink: 0; margin-top: 2px; }
        .search-more { font-size: 10px; color: #94a3b8; padding: 2px 8px 6px 8px; }
        .search-empty { font-size: 12px; color: #64748b; padding: 24px; text-align: center; }

        /* ---------- 首页命中高亮 ---------- */
        .card-dimmed { opacity: 0.18; filter: saturate(0.4); }
        .card-hit-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            background: #0f172a;
            color: #fff;
            font-size: 9.5px;
            font-weight: 700;
            line-height: 16px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(15,23,42,0.4);
        }

        .fullscreen-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(100vw / var(--scale));
            height: calc(100vh / var(--scale));
        }
        .grid-5-centered {
            display: grid;
            grid-template-columns: repeat(5, var(--card-w));
            gap: 16px;
            justify-content: center;
        }
        .grid-6-centered {
            display: grid;
            grid-template-columns: repeat(6, var(--card-w));
            gap: 16px;
            justify-content: center;
        }
        .main-container-width {
             max-width: 1700px;
             margin: 0 auto;
             padding: 0 20px;
        }
        .contact-drawer-overlay {
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }
        .contact-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: calc(100vh / var(--scale));
            width: 360px;
            max-width: 90vw;
            background-color: white;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.1);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 51;
        }
        .contact-drawer.is-open { transform: translateX(0); }

        .mmd-rainbow {
            display: inline-block;
            padding-right: 0.1em;
            background: linear-gradient(90deg,
               #deebf7, #bdd7ee, #7eb0de, #4e93d2, #2867A0, #2f5597,
               #203864, #548235, #91c46e, #b3d46a, #c2dd87, #d5e7ad,
               #fff2cc, #ffe699, #ffd653, #eeb500, #d76213, #ef8d4b,
               #f5b88f, #faddca, #ffabab, #e17171, #c04c4c, #b12568,
               #df639e, #e890ba, #f4c8dd, #e3cef2, #b888dc, #9b56ce,
               #7a33af
            );
            background-size: 200%;
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
            font-style: italic;
            animation: rainbow-move 8s linear infinite;
        }
        @keyframes rainbow-move {
            0%   { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .mmd-gradient {
            display: inline-block;
            padding-right: 0.1em;
            background: linear-gradient(90deg,
                #deebf7, #bdd7ee, #7eb0de, #4e93d2, #2867A0, #2f5597,
                #203864, #548235, #91c46e, #b3d46a, #c2dd87, #d5e7ad,
                #fff2cc, #ffe699, #ffd653, #eeb500, #d76213, #ef8d4b,
                #f5b88f, #faddca, #ffabab, #e17171, #c04c4c, #b12568,
                #df639e, #e890ba, #f4c8dd, #e3cef2, #b888dc, #9b56ce,
                #7a33af
            );
           -webkit-background-clip: text;
           color: transparent;
           font-weight: 900;
           font-style: italic;
       }

       .term-panel-wrapper {
            clip-path: inset(0 0 0 100%);
            -webkit-clip-path: inset(0 0 0 100%);
       }
       .term-panel-enter {
            animation: term-panel-reveal 0.3s ease-out forwards;
       }
       .term-panel-exit {
            animation: term-panel-hide 0.3s ease-in forwards;
       }
       @keyframes term-panel-reveal {
            from {
                clip-path: inset(0 0 0 100%);
                -webkit-clip-path: inset(0 0 0 100%);
            }
            to {
                clip-path: inset(0 0 0 0);
                -webkit-clip-path: inset(0 0 0 0);
            }
       }
       @keyframes term-panel-hide {
            from {
                clip-path: inset(0 0 0 0);
                -webkit-clip-path: inset(0 0 0 0);
            }
            to {
                clip-path: inset(0 0 0 100%);
                -webkit-clip-path: inset(0 0 0 100%);
            }
       }

       /* More/Less 展开区域过渡 */
       .pu-expand-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out, opacity 0.3s ease-out;
            opacity: 0;
       }
       .pu-expand-section.is-expanded {
            max-height: 3000px;
            opacity: 1;
            transition: max-height 0.5s ease-in, opacity 0.3s ease-in;
       }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#64748b">
            <div style="width:42px;height:42px;border:4px solid #e2e8f0;border-top-color:#2867A0;border-radius:50%;animation:mmd-spin 0.8s linear infinite"></div>
            <div style="font-size:15px;letter-spacing:0.02em">Loading the Mega-Map of Design…</div>
        </div>
    </div>
    <style>@keyframes mmd-spin{to{transform:rotate(360deg)}}</style>

    <script type="text/babel">
        const { useMemo, useState, useEffect, useCallback } = React;


        const CLASSIC_GRADIENT_PALETTE_31 = [
            "#deebf7", "#bdd7ee", "#7eb0de", "#4e93d2", "#2867A0", "#2f5597",
            "#203864", "#548235", "#91c46e", "#b3d46a", "#c2dd87", "#d5e7ad",
            "#fff2cc", "#ffe699", "#ffd653", "#eeb500", "#d76213", "#ef8d4b",
            "#f5b88f", "#faddca", "#ffabab", "#e17171", "#c04c4c", "#b12568",
            "#df639e", "#e890ba", "#f4c8dd", "#e3cef2", "#b888dc", "#9b56ce",
            "#7a33af",
        ];

        function lightenHex(hex, amount = 20) {
            if (!hex) return hex;
            hex = hex.replace('#', '');
            if (hex.length !== 6) return '#' + hex;

            const num = parseInt(hex, 16);
            let r = (num >> 16) + amount;
            let g = ((num >> 8) & 0x00FF) + amount;
            let b = (num & 0x0000FF) + amount;

            r = Math.min(255, r);
            g = Math.min(255, g);
            b = Math.min(255, b);

            const newHex =
                '#' +
                r.toString(16).padStart(2, '0') +
                g.toString(16).padStart(2, '0') +
                b.toString(16).padStart(2, '0');

            return newHex;
        }

        function getTextColorForBackground(hex) {
          if (!hex) return '#111827';
          const c = hex.replace('#', '');
          if (c.length !== 6) return '#111827';
          const r = parseInt(c.slice(0, 2), 16);
          const g = parseInt(c.slice(2, 4), 16);
          const b = parseInt(c.slice(4, 6), 16);
          const brightness = (r * 299 + g * 587 + b * 114) / 1000;
          return brightness > 175 ? '#111827' : '#FFFFFF';
        }

        function hexToRgba(hex, alpha = 0.4) {
          if (!hex) return `rgba(0,0,0,${alpha})`;
          const c = hex.replace('#', '');
          if (c.length !== 6) return `rgba(0,0,0,${alpha})`;
          const r = parseInt(c.slice(0, 2), 16);
          const g = parseInt(c.slice(2, 4), 16);
          const b = parseInt(c.slice(4, 6), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        /* ============================================================
           整页等比缩放
           以下面的基准尺寸为准，页面按窗口大小整体放大或缩小，
           因此在任何显示器上看到的都是同一版面的等比缩放，比例不变。
           ============================================================ */
        const BASE_WIDTH = 1560;   // 网格 1484 加两侧留白
        const BASE_HEIGHT = 740;   // 顶部栏加网格总高
        const MIN_SCALE = 0.7;
        const MAX_SCALE = 1.25;

        function computeScale(w, h) {
          const raw = Math.min(w / BASE_WIDTH, h / BASE_HEIGHT);
          return Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(raw * 1000) / 1000));
        }

        const LIST_CATEGORY_HEIGHT = 88;
        const LIST_CATEGORY_ASPECT_RATIO = 2.4;

        /* ============================================================
           数据层
           页面启动时读取同目录下的 mmd.xlsx，因此改表即改内容。
           中文列（如「Category（中文）」）存在时按中英双语显示；
           缺失时自动退回英文，页面不会报错。
           更新 xlsx 后如需强制刷新缓存，把 DATA_VERSION 加一即可。
           ============================================================ */
        const DATA_FILE = "data/mmd.xlsx";
        /* 依次尝试的位置与写法：data 子目录优先，其次同目录；
           GitHub Pages 区分大小写，故一并试 MMD.xlsx */
        const DATA_DIRS = ["data/", "", "/Mega-Map-of-Design/data/"];
        const DATA_NAMES = ["mmd.xlsx", "MMD.xlsx"];
        const DATA_CANDIDATES = DATA_DIRS.reduce(
          (list, dir) => list.concat(DATA_NAMES.map(name => dir + name)), []
        );
        const DATA_VERSION = "1";

        /* 表头归一化：忽略大小写、空格、下划线、BOM 与全半角括号 */
        function normaliseHeader(name) {
          return String(name || "")
            .replace(/^\uFEFF/, "")
            .replace(/[\s_（）()]/g, "")
            .toLowerCase();
        }

        const FIELD_BY_HEADER = {
          "group": "Group",
          "category": "Category",
          "subcategory": "Subcategory",
          "term": "Term",
          "subterm": "Subterm",
          "processingunit": "ProcessingUnit",
          "whatitis": "WhatItIs",
          "whatitisnot": "WhatItIsNot",
          "howitisused": "HowItIsUsed",
          "howitisstudied": "HowItIsStudied",
          "references": "References"
        };

        /* 需要向下填充的列（原表只在区块首行填值） */
        const CARRY_FIELDS = ["Group", "Category", "CategoryZh", "Subcategory", "SubcategoryZh", "Term", "TermZh"];

        /* 把一行原始数据映射为统一字段名，中文列加 Zh 后缀 */
        function mapRow(raw) {
          const row = {};
          Object.keys(raw).forEach(key => {
            const norm = normaliseHeader(key);
            const isZh = norm.indexOf("中文") !== -1;
            const base = FIELD_BY_HEADER[norm.replace("中文", "")];
            if (!base) return;
            const value = raw[key] === undefined || raw[key] === null ? "" : String(raw[key]).trim();
            row[isZh ? base + "Zh" : base] = value;
          });
          return row;
        }

        function normaliseRows(rawRows) {
          const carried = {};
          const rows = [];

          rawRows.forEach(raw => {
            const row = mapRow(raw);

            CARRY_FIELDS.forEach(field => {
              const value = row[field] || "";
              if (value === "") {
                row[field] = carried[field] || "";
              } else {
                carried[field] = value;
              }
            });

            // 只有破折号的 Subterm 视为空
            const onlyDashes = String(row.Subterm || "").replace(/[\s\u00A0\u200B]+/g, "");
            if (/^[-—–]*$/.test(onlyDashes)) {
              row.Subterm = "";
              row.SubtermZh = "";
            }

            // 四个描述列优先取中文，缺中文时退回英文
            ["WhatItIs", "WhatItIsNot", "HowItIsUsed", "HowItIsStudied"].forEach(field => {
              row[field] = row[field + "Zh"] || row[field] || "";
            });
            row.References = row.References || "";

            if (!row.Group || !row.Category || !row.Subcategory || !row.Term) return;
            rows.push(row);
          });

          return rows;
        }

        function parseWorkbook(arrayBuffer) {
          const XLSX = window.XLSX;
          if (!XLSX) throw new Error("SheetJS not loaded");
          const workbook = XLSX.read(arrayBuffer, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          return normaliseRows(XLSX.utils.sheet_to_json(sheet, { defval: "" }));
        }

        /* 把「英文；英文」与「中文；中文」按序配对；数量不一致时整体配对 */
        function pairBilingualList(en, zh) {
          const splitList = (s) => String(s || "").split(/[;；]/).map(x => x.trim()).filter(Boolean);
          const enList = splitList(en);
          const zhList = splitList(zh);
          if (!enList.length) return [];
          if (!zhList.length) return enList.map(e => ({ en: e, zh: "" }));
          if (zhList.length === enList.length) {
            return enList.map((e, i) => ({ en: e, zh: zhList[i] }));
          }
          return [{ en: String(en || "").trim(), zh: String(zh || "").trim() }];
        }

        /* ============================================================
           检索
           字段：Category / Sub-category / Term / Definition /
                 Clarification / References
           匹配：忽略大小写、连字符、变音符与 & ；-ise 与 -ize、
                 单复数视为同一形式；全无结果时再放宽一个字符的拼写偏差
           ============================================================ */
        const SEARCH_FIELDS = [
          { key: "category",      label: "Category" },
          { key: "subcategory",   label: "Sub-category" },
          { key: "term",          label: "Term" },
          { key: "definition",    label: "Definition" },
          { key: "clarification", label: "Clarification" },
          { key: "references",    label: "References" }
        ];

        const DEFAULT_FIELDS = {
          category: true, subcategory: true, term: true,
          definition: true, clarification: false, references: false
        };

        const FIELD_WEIGHT = {
          category: 0, subcategory: 1, term: 2,
          definition: 3, clarification: 4, references: 5
        };

        function stemToken(token) {
          let t = token;
          t = t.replace(/isation$/, "ization")
               .replace(/ising$/, "izing")
               .replace(/ised$/, "ized")
               .replace(/ise$/, "ize")
               .replace(/yse$/, "yze");
          if (t.length > 3 && t.endsWith("s") && !t.endsWith("ss")) t = t.slice(0, -1);
          return t;
        }

        function splitWords(value) {
          return String(value || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/&/g, " and ")
            .replace(/[^a-z0-9]+/g, " ")
            .trim()
            .split(" ")
            .filter(Boolean);
        }

        function normaliseForSearch(value) {
          return " " + splitWords(value).map(stemToken).join(" ") + " ";
        }

        /* 编辑距离是否不超过 1 */
        function withinOneEdit(a, b) {
          if (a === b) return true;
          const la = a.length, lb = b.length;
          if (Math.abs(la - lb) > 1) return false;
          let i = 0, j = 0, edits = 0;
          while (i < la && j < lb) {
            if (a[i] === b[j]) { i++; j++; continue; }
            if (++edits > 1) return false;
            if (la > lb) i++;
            else if (lb > la) j++;
            else { i++; j++; }
          }
          return true;
        }

        function buildSearchIndex(flatCategories) {
          const entries = [];
          const add = (entry) => {
            if (!entry.text) return;
            entry.norm = normaliseForSearch(entry.text);
            entry.id = entries.length;
            entries.push(entry);
          };

          flatCategories.forEach((c) => {
            add({ field: "category", level: "Category", text: c.name, ci: c.ci, subIdx: null, term: null, catName: c.name, subName: null, color: c.color });

            c.subs.forEach((s, si) => {
              add({ field: "subcategory", level: "Sub-category", text: s.label, ci: c.ci, subIdx: si, term: null, catName: c.name, subName: s.label, color: c.color });

              s.items.forEach((it) => {
                const base = { ci: c.ci, subIdx: si, term: it.term, catName: c.name, subName: s.label, color: c.color };
                add(Object.assign({ field: "term", level: "Term", text: it.term }, base));

                (it.subterms || []).forEach((st) => {
                  add(Object.assign({ field: "term", level: "Subterm", text: st.en }, base));
                });

                (it.processingUnits || []).forEach((pu) => {
                  if (pu.name && pu.name !== it.term) {
                    add(Object.assign({ field: "term", level: "Processing Unit", text: pu.name }, base));
                  }
                  add(Object.assign({ field: "definition", level: "Definition", text: pu.whatItIs }, base));
                  const clarification = [pu.whatItIsNot, pu.howItIsUsed, pu.howItIsStudied].filter(Boolean).join("\n");
                  add(Object.assign({ field: "clarification", level: "Clarification", text: clarification }, base));
                  add(Object.assign({ field: "references", level: "References", text: pu.references }, base));
                });
              });
            });
          });

          return entries;
        }

        /* 打分：越小越靠前 */
        function scoreEntry(entry, phrase) {
          const norm = entry.norm;
          let quality = 3;
          if (norm === phrase + " ") quality = 0;
          else if (norm.indexOf(phrase) === 0) quality = 1;
          else if (norm.indexOf(phrase) !== -1) quality = 2;
          return quality * 10 + (FIELD_WEIGHT[entry.field] || 0) + Math.min(4, entry.text.length / 400);
        }

        function runSearch(index, rawQuery, fields, limit) {
          const stems = splitWords(rawQuery).map(stemToken);
          if (!stems.length) return [];

          const wanted = index.filter(e => fields[e.field]);
          const phrase = " " + stems.join(" ");

          /* 一，整串相邻匹配，例如 co-design 只命中 Co-Design 一类 */
          let hits = wanted.filter(e => e.norm.indexOf(phrase) !== -1);

          /* 二，退而求其次，各词分散出现即可，词首对齐以免 co 命中 concept */
          if (!hits.length) {
            hits = wanted.filter(e => stems.every(t => e.norm.indexOf(" " + t) !== -1));
          }

          /* 三，仍无结果时放宽一个字符的拼写偏差 */
          if (!hits.length) {
            hits = wanted.filter((entry) => {
              const words = entry.norm.trim().split(" ");
              return stems.every(t => words.some(w => withinOneEdit(w, t)));
            });
          }

          hits.sort((a, b) => scoreEntry(a, phrase) - scoreEntry(b, phrase) || a.id - b.id);
          return limit ? hits.slice(0, limit) : hits;
        }

        /* 把命中的关键词标出来，并在长文本中截取上下文 */
        function highlightParts(text, words, contextLength) {
          const source = String(text || "");
          const lower = source.toLowerCase();
          const ranges = [];
          words.forEach((w) => {
            if (!w) return;
            let i = lower.indexOf(w);
            while (i !== -1) {
              ranges.push([i, i + w.length]);
              i = lower.indexOf(w, i + w.length);
            }
          });
          ranges.sort((a, b) => a[0] - b[0]);

          const merged = [];
          ranges.forEach((r) => {
            const last = merged[merged.length - 1];
            if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
            else merged.push(r.slice());
          });

          let start = 0, end = source.length, prefix = "", suffix = "";
          if (contextLength && source.length > contextLength) {
            const anchor = merged.length ? merged[0][0] : 0;
            start = Math.max(0, anchor - Math.floor(contextLength / 3));
            end = Math.min(source.length, start + contextLength);
            if (start > 0) prefix = "… ";
            if (end < source.length) suffix = " …";
          }

          const nodes = [];
          let cursor = start;
          merged.forEach(([a, b], k) => {
            if (b <= start || a >= end) return;
            const from = Math.max(a, start), to = Math.min(b, end);
            if (from > cursor) nodes.push(source.slice(cursor, from));
            nodes.push(<mark key={k} className="search-mark">{source.slice(from, to)}</mark>);
            cursor = to;
          });
          if (cursor < end) nodes.push(source.slice(cursor, end));

          return [prefix, ...nodes, suffix];
        }

        /* ============================================================
           buildStructure — 单层结构：Category 按原表顺序平铺
           颜色仍按 Group 依次取自 31 色渐变色板
           ============================================================ */
        function buildStructure(rows) {
          const flatCategories = [];
          let currentGroup = "";
          let colorIndex = -1;
          let currentColor = CLASSIC_GRADIENT_PALETTE_31[0];

          rows.forEach((row, idx) => {
            if (row.Group !== currentGroup) {
              currentGroup = row.Group;
              colorIndex = (colorIndex + 1) % CLASSIC_GRADIENT_PALETTE_31.length;
              currentColor = CLASSIC_GRADIENT_PALETTE_31[colorIndex];
            }

            let cat = flatCategories.find(c => c.name === row.Category && c.group === currentGroup);
            if (!cat) {
              cat = {
                key: `${idx}-${row.Category}`,
                name: row.Category,
                nameZh: row.CategoryZh,
                color: currentColor,
                group: currentGroup,
                subs: [],
                ci: flatCategories.length
              };
              flatCategories.push(cat);
            }

            let sc = cat.subs.find(s => s.label === row.Subcategory);
            if (!sc) {
              sc = { label: row.Subcategory, labelZh: row.SubcategoryZh, color: cat.color, items: [] };
              cat.subs.push(sc);
            }

            let item = sc.items.find(it => it.term === row.Term);
            if (!item) {
              item = { term: row.Term, termZh: row.TermZh, subterms: [], processingUnits: [] };
              sc.items.push(item);
            }

            if (row.Subterm) {
              pairBilingualList(row.Subterm, row.SubtermZh).forEach(pair => {
                if (!item.subterms.some(s => s.en === pair.en)) item.subterms.push(pair);
              });
            }

            if (row.ProcessingUnit && !item.processingUnits.some(pu => pu.name === row.ProcessingUnit)) {
              item.processingUnits.push({
                name: row.ProcessingUnit,
                nameZh: row.ProcessingUnitZh,
                whatItIs: row.WhatItIs || '',
                whatItIsNot: row.WhatItIsNot || '',
                howItIsUsed: row.HowItIsUsed || '',
                howItIsStudied: row.HowItIsStudied || '',
                references: row.References || ''
              });
            }
          });

          return { flatCategories };
        }

        function useParsedData(rows) {
          return useMemo(() => {
            if (!rows || !rows.length) return { flatCategories: [], count: 0 };
            const { flatCategories } = buildStructure(rows);
            console.log("Parsed categories:", flatCategories.length);
            return { flatCategories, count: flatCategories.length };
          }, [rows]);
        }

        /* 双语显示：英文在上，中文在下 */
        const Bi = ({ en, zh, enClass = "", zhClass = "" }) => (

        function getFixedPositionsRect(centerW, centerH) {
          const subH = Math.round(centerH * 0.68);
          const subW = Math.round(centerW * 0.68);

          const maxSlots = 13;
          const positions = [];

          const margin = 20;

          const baseRadiusX = centerW / 2 + subW / 2 + margin;
          const baseRadiusY = centerH / 2 + subH / 2 + margin;

          const radiusScaleX = 1.5;
          const radiusScaleY = 2.0;

          const radiusX = baseRadiusX * radiusScaleX;
          const radiusY = baseRadiusY * radiusScaleY;

          const step = (2 * Math.PI) / maxSlots;
          const offsetFactor = 0.37;
          const angleOffset = step * offsetFactor;

          for (let i = 0; i < maxSlots; i++) {
            const angle = -Math.PI / 2 + angleOffset + step * i;
            const x = Math.round(Math.cos(angle) * radiusX);
            const y = Math.round(Math.sin(angle) * radiusY);
            positions.push({ x, y });
          }

          return { positions, subW, subH };
        }

        const SearchBar = ({

                onPick(suggestions[cursor]);
                setShowSuggest(false);
              } else {
                onSubmit();
                setShowSuggest(false);
              }
            } else if (e.key === "Escape") {
              setShowSuggest(false);
              setShowFields(false);

                          pu={pu}
                          singlePU={it.processingUnits.length === 1}
                          textColor={panelTextColor}
                        />
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        };


        function DesignMapPage() {
          const [rows, setRows] = useState([]);
          const [loadStatus, setLoadStatus] = useState("loading");
          const [loadError, setLoadError] = useState("");
          const { flatCategories, count } = useParsedData(rows);
          const [active, setActive] = useState(null);
          const [detailIdx, setDetailIdx] = useState(null);
          const [isContactOpen, setIsContactOpen] = useState(false);
          const [vh, setVh] = useState(800);
          const [scale, setScale] = useState(1);
          const [query, setQuery] = useState("");
          const [fields, setFields] = useState(DEFAULT_FIELDS);
          const [submittedQuery, setSubmittedQuery] = useState("");
          const [isResultsOpen, setIsResultsOpen] = useState(false);
          const [targetTerm, setTargetTerm] = useState(null);
          const [isPanelClosing, setIsPanelClosing] = useState(false);
          const [isDetailLayoutActive, setIsDetailLayoutActive] = useState(false);

          /* 启动时读取同目录下的 mmd.xlsx */
          useEffect(() => {
            let cancelled = false;

            (async () => {
              if (window.location && window.location.protocol === "file:") {
                console.warn("Opened via file://, fetch is blocked by the browser.");
                setLoadError("The page was opened directly from disk (file://). Browsers block local pages from reading neighbouring files.");
                setLoadStatus("error");
                return;
              }

              let lastError = "";
              for (const candidate of DATA_CANDIDATES) {
                const url = `${candidate}?v=${DATA_VERSION}`;
                try {
                  const res = await fetch(url);
                  if (!res.ok) { lastError = `${candidate} → HTTP ${res.status}`; continue; }
                  const parsed = parseWorkbook(await res.arrayBuffer());
                  if (cancelled) return;
                  if (!parsed.length) { lastError = `${candidate} → no usable rows`; continue; }
                  setRows(parsed);
                  setLoadStatus("ready");
                  return;
                } catch (err) {
                  lastError = `${candidate} → ${err && err.message ? err.message : err}`;
                  console.warn("Failed to load", url, err);
                }
              }

              if (!cancelled) {
                setLoadError(lastError);
                setLoadStatus("error");
              }
            })();

            return () => { cancelled = true; };
          }, []);

          /* 备用入口：本地双击打开时浏览器禁止读取同目录文件，改为手动选择 */
          const handleFileSelect = (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            setLoadStatus("loading");
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const parsed = parseWorkbook(e.target.result);
                if (!parsed.length) throw new Error("no usable rows");
                setRows(parsed);
                setLoadStatus("ready");
              } catch (err) {
                console.error("Failed to parse the selected file:", err);
                setLoadStatus("error");
              }
            };
            reader.onerror = () => setLoadStatus("error");
            reader.readAsArrayBuffer(file);
          };

          useEffect(() => {
            const update = () => {
              const w = window.innerWidth || BASE_WIDTH;
              const innerH = window.innerHeight || 800;
              const k = computeScale(w, innerH);
              setScale(k);
              document.documentElement.style.setProperty("--scale", String(k));
              setVh(Math.round(innerH / k));
            };
            update();
            window.addEventListener("resize", update);
            return () => window.removeEventListener("resize", update);
          }, []);

          useEffect(() => {
            if (active || isContactOpen) {
              document.body.style.overflow = 'hidden';
            } else {
              document.body.style.overflow = '';
            }
            return () => {
              document.body.style.overflow = '';
            };
          }, [active, isContactOpen]);

          const searchIndex = useMemo(() => buildSearchIndex(flatCategories), [flatCategories]);

          const suggestions = useMemo(() => {
            if (!query.trim()) return [];
            const nameFields = { category: fields.category, subcategory: fields.subcategory, term: fields.term };
            return runSearch(searchIndex, query, nameFields, 8);
          }, [searchIndex, query, fields.category, fields.subcategory, fields.term]);

          const results = useMemo(() => {
            if (!submittedQuery.trim()) return [];
            return runSearch(searchIndex, submittedQuery, fields, 0);
          }, [searchIndex, submittedQuery, fields]);

          const hitsByCategory = useMemo(() => {
            const counts = {};
            results.forEach(r => { counts[r.ci] = (counts[r.ci] || 0) + 1; });
            return counts;
          }, [results]);

          const isFiltering = submittedQuery.trim().length > 0;

          const jumpTo = (entry) => {
            setActive({ ci: entry.ci });
            setDetailIdx(entry.subIdx === null || entry.subIdx === undefined ? null : entry.subIdx);
            setTargetTerm(entry.term || null);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(entry.subIdx !== null && entry.subIdx !== undefined);
            setIsResultsOpen(false);
          };

          const submitSearch = () => {
            const q = query.trim();
            setSubmittedQuery(q);
            setIsResultsOpen(!!q);
          };

          const clearSearch = () => {
            setQuery("");
            setSubmittedQuery("");
            setIsResultsOpen(false);
            setTargetTerm(null);
          };

          const openCategory = (ci) => {
            setActive({ ci });
            setTargetTerm(null);
            setDetailIdx(null);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(false);
          };

          const closeOverlay = () => {
            setActive(null);
            setDetailIdx(null);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(false);
          };

          const closeTermPanelWithAnimation = () => {
            if (detailIdx === null) return;
            setIsDetailLayoutActive(false);
            setIsPanelClosing(true);
            setTimeout(() => {
              setDetailIdx(null);
              setIsPanelClosing(false);
            }, 300);
          };

          const handleOverlayClick = () => {
            if (detailIdx !== null) {
              closeTermPanelWithAnimation();
            } else {
              closeOverlay();
            }
          };

          useEffect(() => {
            const handleKey = (e) => {
              if (e.key === 'Escape') {
                if (isResultsOpen) {
                  e.preventDefault();
                  setIsResultsOpen(false);
                } else if (active && detailIdx !== null) {
                  e.preventDefault();
                  closeTermPanelWithAnimation();
                } else if (active) {
                  e.preventDefault();
                  closeOverlay();
                } else if (isContactOpen) {
                  e.preventDefault();
                  setIsContactOpen(false);
                }
              }
            };
            window.addEventListener('keydown', handleKey);
            return () => window.removeEventListener('keydown', handleKey);
          }, [active, detailIdx, isContactOpen, isResultsOpen]);

          const CategoryCard = ({ c, ci }) => {
              const textColor = getTextColorForBackground(c.color);
              const hitCount = hitsByCategory[c.ci] || 0;
              const dimmed = isFiltering && hitCount === 0;

              return (
                <button
                    onClick={() => openCategory(ci)}
                    className={`w-full text-left relative ${dimmed ? 'card-dimmed' : ''}`}
                    aria-label={`open ${c.name} overlay`}
                >
                    {isFiltering && hitCount > 0 && (
                        <span className="card-hit-badge">{hitCount}</span>
                    )}
                    <div
                        className="category-card-base rounded-xl px-4 py-1.5 shadow-lg ring-1 ring-black/10 transition hover:shadow-2xl focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-white flex items-center justify-center text-center"
                        style={{ background: c.color, color: textColor }}
                        title={`Group: ${c.group} / Category: ${c.name} ${c.nameZh || ''}`}
                    >
                        <div className="w-full">
                            <Bi
                                en={c.name}
                                zh={c.nameZh}
                                enClass="text-[12px] font-semibold leading-tight break-words line-clamp-2"
                                zhClass="text-[12px] font-medium leading-tight break-words line-clamp-1 opacity-90"
                            />
                        </div>
                    </div>
                </button>
              );
          };

          const EmptyCard = () => (
              <div
                  className="category-card-base rounded-2xl p-4 transition"
                  style={{ opacity: 0 }}
              />
          );

          /* 结尾的空位：虚线浅灰框，明确不可点击，
             提示 MMD 可以继续接纳新出现的研究领域 */
          const PlaceholderCard = () => (
              <div
                  className="category-card-base rounded-xl flex items-center justify-center text-center select-none"
                  style={{
                      background: '#ffffff',
                      border: '2px dashed #dbe1e8',
                      color: '#cbd5e1',
                      cursor: 'default',
                      pointerEvents: 'none'
                  }}
                  aria-hidden="true"
              >
                  <div className="text-xl font-light leading-none">+</div>
              </div>
          );

          const renderPage1 = () => {
            if (loadStatus === "loading") {
              return (
                <div className="main-container-width flex flex-col items-center justify-center gap-3 py-32 text-slate-500">
                  <div className="text-lg font-semibold text-slate-700">Loading the Mega-Map of Design…</div>
                  <div className="text-sm">Reading {DATA_FILE}</div>
                </div>
              );
            }

            if (loadStatus === "error" || flatCategories.length === 0) {
              return (
                <div className="main-container-width flex flex-col items-center justify-center gap-3 py-32 text-slate-500">
                  <div className="text-lg font-semibold text-slate-700">Could not load {DATA_FILE}</div>
                  <div className="text-sm text-center max-w-lg">
                    This page reads {DATA_FILE} and needs to be opened through a web server or GitHub
                    Pages. Check that the workbook sits in the data folder next to index.html and that its
                    name matches exactly, including capitalisation.
                  </div>
                  {loadError && (
                    <div className="text-xs text-slate-400 text-center max-w-lg break-all">{loadError}</div>
                  )}
                  <label className="mt-2 cursor-pointer rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                    Select {DATA_FILE}
                    <input type="file" accept=".xlsx,.xls" className="hidden" onChange={handleFileSelect} />
                  </label>
                </div>
              );
            }

            /* 取消 Layer 分层，全部 Category 按原表顺序平铺
               行长 6 / 5 交替（原 Layer 3 的排列方式），偶数行反向排列 */
            /* 队尾追加一块占位卡片，随 Category 数量一起流动 */
            const entries = flatCategories.map(c => ({ type: 'category', c }));
            entries.push({ type: 'placeholder' });

            const blocks = [];
            let cursor = 0;
            let isOddRow = true;
            while (cursor < entries.length) {
              const size = isOddRow ? 6 : 5;
              blocks.push({
                items: entries.slice(cursor, cursor + size),
                size,
                isOddRow
              });
              cursor += size;
              isOddRow = !isOddRow;
            }

            return (
                <div className="main-container-width pt-2">
                    {blocks.map((block, index) => {
                        const gridClass = block.isOddRow ? 'grid-6-centered' : 'grid-5-centered';
                        const cards = block.items.map((entry, k) => (
                            entry.type === 'category'
                                ? <CategoryCard key={entry.c.key} c={entry.c} ci={entry.c.ci} />
                                : <PlaceholderCard key={`placeholder-${index}-${k}`} />
                        ));
                        if (!block.isOddRow) cards.reverse();

                        const padCount = block.size - block.items.length;
                        const pads = Array.from({ length: padCount }).map((_, k) => (
                            <EmptyCard key={`empty-${index}-${k}`} />
                        ));

                        return (
                            <div key={`row-${index}`} className={`w-full mb-[7px] ${gridClass}`}>
                                {block.isOddRow ? [...cards, ...pads] : [...pads, ...cards]}
                            </div>
                        );
                    })}
                </div>
            );
          };

          return (
            <div className="min-h-screen w-full bg-white text-slate-800" style={{ zoom: scale }}>

              <div className="sticky top-0 z-20 bg-white/95 backdrop-blur-sm border-b border-slate-100">
                <div className="main-container-width pt-3 pb-0 flex flex-col items-center">

                  <div className="absolute top-3 left-5">
                      <span className="mmd-gradient text-base">
                          MMD
                      </span>
                  </div>

                  <div className="absolute top-3 right-5">
                      <button
                          onClick={() => setIsContactOpen(true)}
                          className="text-xs font-medium border border-slate-300 px-3 py-1 rounded-lg text-slate-700 hover:bg-slate-50 transition"
                      >
                          Contact Us
                      </button>
                  </div>

                  <h1 className="text-xl font-extrabold text-slate-900 mb-2">
                    Mega-Map of Design
                  </h1>

                  <SearchBar
                    query={query}
                    setQuery={setQuery}
                    fields={fields}
                    setFields={setFields}
                    suggestions={suggestions}
                    onPick={jumpTo}
                    onSubmit={submitSearch}
                    onClear={clearSearch}
                    hasResults={isFiltering}
                    resultCount={results.length}
                  />
                </div>
              </div>

              <ContactDrawer
                  isOpen={isContactOpen}
                  onClose={() => setIsContactOpen(false)}
              />

              {isResultsOpen && (
                <SearchResultsPanel
                  query={submittedQuery}
                  results={results}
                  onPick={jumpTo}
                  onClose={() => setIsResultsOpen(false)}
                />
              )}

              {renderPage1()}

              {active && (() => {
                  const C = flatCategories[active.ci];
                  if (!C) return null;

                  const subs = C.subs || [];
                  const CENTER_H = LIST_CATEGORY_HEIGHT + 30;
                  const CENTER_W = Math.round(CENTER_H * LIST_CATEGORY_ASPECT_RATIO);
                  const ellipseShiftX = isDetailLayoutActive ? -160 : 0;
                  const centerShiftX = isDetailLayoutActive ? -160 : 0;

                  const { positions: POS, subW, subH } = getFixedPositionsRect(CENTER_W, CENTER_H);

                  const maxSlots = POS.length;
                  const usedCount = Math.min(subs.length, maxSlots);
                  let ringOrder = [];
                  if (maxSlots > 0) {
                    let maxX = -Infinity;
                    for (let i = 0; i < maxSlots; i++) {
                      if (POS[i].x > maxX) maxX = POS[i].x;
                    }
                    const indexed = POS.map((p, idx) => ({ idx, x: p.x, y: p.y }));
                    indexed.sort((a, b) => {
                      const da = Math.abs(a.x - maxX);
                      const db = Math.abs(b.x - maxX);
                      if (da !== db) return da - db;
                      if (a.y !== b.y) return a.y - b.y;
                      return a.idx - b.idx;
                    });
                    ringOrder = indexed.map(p => p.idx);
                  }
                  const usedIndices = ringOrder.slice(0, usedCount);

                  const centerTextColor = getTextColorForBackground(C.color);

                  return (
                    <div
                      className="fullscreen-layer z-30 bg-slate-900/70 backdrop-blur-sm"
                      onClick={handleOverlayClick}
                    >
                      <div className="flex items-center justify-center w-full h-full p-6">
                        <div
                          className="relative w-full max-w-7xl"
                          style={{ height: Math.round(vh * 0.8) }}
                        >
                          <div className="w-full h-full flex gap-6">

                            <div className="w-[65%] h-full relative">
                              <div className="absolute inset-0">

                                <div
                                  className="absolute rounded-3xl shadow-2xl ring-2 ring-white/70 flex items-center justify-center text-center p-4 cursor-default transition-all duration-300 ease-out"
                                  style={{
                                    width: CENTER_W,
                                    height: CENTER_H,
                                    left: `calc(50% + ${centerShiftX}px)`,
                                    top: '50%',
                                    transform: `translate(-50%, -50%)`,
                                    background: C.color,
                                    color: centerTextColor,
                                    userSelect: 'text'
                                  }}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                  }}
                                >
                                  <div className="max-w-[11rem]">
                                    <Bi
                                      en={C.name}
                                      zh={C.nameZh}
                                      enClass="text-base font-semibold leading-tight break-words"
                                      zhClass="text-[15px] font-medium leading-tight break-words opacity-90 mt-1"
                                    />
                                  </div>
                                </div>

                                {Array.from({ length: usedCount }).map((_, idx) => {
                                  const sub = subs[idx];
                                  const posIndex = usedIndices[idx];
                                  const p = POS[posIndex];

                                  const isSelected = detailIdx === idx;
                                  const isActive = (isDetailLayoutActive || isPanelClosing) && isSelected;

                                  const subBg = lightenHex(C.color, 50);
                                  const subTextColor = getTextColorForBackground(subBg);
                                  const borderWidth = isActive ? 6 : 3;
                                  const subBoxShadow = `0 0 0 ${borderWidth}px rgba(255,255,255,0.7), 0 8px 22px rgba(15,23,42,0.35)`;

                                  return (
                                    <button
                                      key={idx}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        if (detailIdx === null) {
                                          setDetailIdx(idx);
                                          setIsPanelClosing(false);
                                          setIsDetailLayoutActive(true);
                                        } else if (detailIdx !== idx) {
                                          setDetailIdx(idx);
                                          setIsPanelClosing(false);
                                          setIsDetailLayoutActive(true);
                                        }
                                      }}
                                      className="absolute rounded-xl shadow-lg ring-1 ring-black/10 text-center flex items-center justify-center transition-all duration-300 ease-out"
                                      style={{
                                        width: subW,
                                        height: subH,
                                        left: `calc(50% + ${p.x + ellipseShiftX}px)`,
                                        top: `calc(50% + ${p.y}px)`,
                                        transform: 'translate(-50%, -50%)',
                                        background: subBg,
                                        color: subTextColor,
                                        boxShadow: subBoxShadow,
                                        opacity:
                                          (isDetailLayoutActive || isPanelClosing) && detailIdx !== null && !isSelected
                                            ? 0.4
                                            : 1,
                                        userSelect: 'text',
                                        cursor: isSelected ? 'default' : 'pointer',
                                        zIndex: isActive ? 30 : 10
                                      }}
                                    >
                                      <div className="px-2 py-1.5">
                                        <Bi
                                          en={sub?.label || "Subcategory"}
                                          zh={sub?.labelZh}
                                          enClass="text-[13px] font-medium leading-tight break-words"
                                          zhClass="text-[12px] font-medium leading-tight break-words opacity-90 mt-0.5"
                                        />
                                      </div>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>

                            <div className="w-[35%] h-full flex items-center justify-end">
                              {detailIdx !== null && (() => {
                                const s = subs[detailIdx] || { label: 'No Subcategory', items: [] };
                                const items = s.items;

                                const panelBg = lightenHex(C.color, 50);
                                const panelTextColor = getTextColorForBackground(panelBg);
                                const panelBoxShadow = '0 0 0 6px rgba(255,255,255,0.7), 0 8px 22px rgba(15,23,42,0.35)';

                                return (
                                  <div
                                     key={detailIdx}
                                     className={`term-panel-wrapper ${isPanelClosing ? 'term-panel-exit' : 'term-panel-enter'}`}
                                     style={{ height: '90%', width: '100%', padding: '6px', boxSizing: 'border-box' }}
                                     onClick={(e) => e.stopPropagation()}
                                  >
                                    <div
                                      className="rounded-3xl w-full h-full overflow-hidden transition-all ease-out shadow-lg ring-1 ring-black/10"
                                      style={{
                                          background: panelBg,
                                          color: panelTextColor,
                                          userSelect: 'text',
                                          boxShadow: panelBoxShadow,
                                      }}
                                    >
                                      {/* 标题 + 横线 */}
                                      <div
                                        className="px-5 pt-3 pb-2"
                                        style={{
                                               borderBottom: `1px solid ${hexToRgba(panelTextColor, 0.4)}`
                                        }}
                                      >
                                        <div className="pr-4" style={{ color: panelTextColor }}>
                                            <Bi
                                                en={s.label || 'Subcategory Detail'}
                                                zh={s.labelZh}
                                                enClass="text-base font-bold leading-snug"
                                                zhClass="text-xs font-semibold leading-snug opacity-90"
                                            />
                                        </div>
                                      </div>

                                      {/* 内容区域 */}
                                      <div className="px-5 py-4 overflow-y-auto h-full pb-10">
                                        {items.length > 0 ? (
                                          items.map((it, i) => (
                                            <TermItem
                                              key={i}
                                              it={it}
                                              panelTextColor={panelTextColor}
                                              borderColor={hexToRgba(panelTextColor, 0.3)}
                                              isTarget={!!targetTerm && it.term === targetTerm}
                                            />
                                          ))
                                        ) : (
                                          <div className="text-center text-base opacity-80 pt-10">
                                              此 Subcategory 暂无 Term 或 Subterm 数据。
                                          </div>
                                        )}
                                        <div className="h-10" />
                                      </div>
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>

                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}


            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DesignMapPage />);
    </script>
</body>
</html>
