                  <span className="history-main">
                    <span className="history-term">{item.term}</span>
                    <span className="history-path">{item.category}{item.subcategory ? ` · ${item.subcategory}` : ""}</span>
                  </span>
                </button>
              ))}
            </div>
          );
        };

        /* ============================================================
           TermItem — 面板中每个 Term 的折叠/展开容器
           默认折叠，点击小三角展开 subterms + PU 内容
           Term 与 Subterm 均为「英文 + 中文」显示
           ============================================================ */
        const TermItem = ({ it, panelTextColor, borderColor, isTarget, targetTermKey, targetNonce, recommendedLinks, allLinks, allLinksReady, onPreviewLink, onVisitTerm, meta }) => {
          const [open, setOpen] = useState(!!isTarget);
          const [showAllLinks, setShowAllLinks] = useState(false);
          const nodeRef = React.useRef(null);
          const hasLinks = (allLinks && allLinks.length) || (recommendedLinks && recommendedLinks.length);

          useEffect(() => {
            if (!targetTermKey) return;
            setOpen(!!isTarget);
            if (isTarget) {
              const node = nodeRef.current;
              const scroller = node && node.closest ? node.closest('.term-panel-content') : null;
              if (node && scroller && scroller.scrollTo) {
                const nodeRect = node.getBoundingClientRect();
                const scrollerRect = scroller.getBoundingClientRect();
                const targetTop = scroller.scrollTop + (nodeRect.top - scrollerRect.top) - 8;
                scroller.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
              } else if (node && node.scrollIntoView) {
                node.scrollIntoView({ block: "nearest", behavior: "smooth" });
              }
            }
          }, [targetNonce, targetTermKey, isTarget]);

          const linkedTermsButton = hasLinks && allLinksReady && allLinks && allLinks.length ? (
            <button
              onClick={(e) => { e.stopPropagation(); setShowAllLinks(!showAllLinks); }}
              className="linked-term-button"
              style={{ background: hexToRgba(panelTextColor, 0.12), color: panelTextColor }}
            >
              {showAllLinks ? 'All linked terms ▴' : `All linked terms ▾`}
            </button>
          ) : null;

          const linkedTermsArea = hasLinks ? (
            <div className="term-linked-terms-area" onClick={(e) => e.stopPropagation()}>
              <div className="flex justify-end mt-3 mb-1">
                {linkedTermsButton}
              </div>
              <LinkedTermsStrip
                recommendedLinks={recommendedLinks || []}
                allLinks={allLinks || []}
                showAll={showAllLinks}
                onPreview={onPreviewLink}
              />
            </div>
          ) : null;

          const openTerm = (e) => {
            e.stopPropagation();
            if (isDragOrSelection(e)) return;
            const nextOpen = !open;
            setOpen(nextOpen);
            if (nextOpen && onVisitTerm && meta) onVisitTerm(meta);
          };

          return (
            <div
              ref={nodeRef}
              className="mb-4 pb-3"
              style={{
                borderBottom: `1px solid ${borderColor}`
              }}
            >
              {it.term && (
                <div
                  className="flex items-start justify-between cursor-pointer"
                  onMouseDown={markPointerDown}
                  onClick={openTerm}
                >
                  <div className="mb-1 flex-1 pr-2">
                    <Bi
                      en={it.term}
                      zh={it.termZh}
                      enClass="text-[15px] font-bold leading-snug"
                      zhClass="text-xs font-semibold leading-snug opacity-90"
                    />
                  </div>
                  <span
                    className="flex-shrink-0 mt-1.5 text-xs transition-transform duration-200"
                    style={{
                      display: 'inline-block',
                      transform: open ? 'rotate(180deg)' : 'rotate(0deg)',
                      opacity: 0.6,
                    }}
                  >
                    ▼
                  </span>
                </div>
              )}

              {open && (
                <div>
                  {it.subterms && it.subterms.length ? (
                    <ul className="mt-2 opacity-95 list-none space-y-1.5">
                      {it.subterms.map((sub, j) => (
                        <li key={j} className="flex">
                          <span className="mr-2 flex-shrink-0 text-sm">–</span>
                          <span className="flex-1">
                            <Bi
                              en={sub.en}
                              zh={sub.zh}
                              enClass="text-[13px] leading-snug"
                              zhClass="text-[11px] leading-snug opacity-85"
                            />
                          </span>
                        </li>
                      ))}
                    </ul>
                  ) : null}

                  {it.processingUnits && it.processingUnits.length > 0 && (
                    <div className="mt-2">
                      {it.processingUnits.map((pu, k) => (
                        <ProcessingUnitBlock
                          key={k}
                          pu={pu}
                          singlePU={it.processingUnits.length === 1}
                          textColor={panelTextColor}
                        />
                      ))}
                    </div>
                  )}

                  {linkedTermsArea}
                </div>
              )}
            </div>
          );
        };


        function DesignMapPage() {
          const [rows, setRows] = useState([]);
          const [recommendedLinks, setRecommendedLinks] = useState([]);
          const [allLinksBySourceRaw, setAllLinksBySourceRaw] = useState({});
          const [allLinksStatus, setAllLinksStatus] = useState("idle");
          const allLinksWorkerRef = React.useRef(null);
          const workbookBufferRef = React.useRef(null);
          const [loadStatus, setLoadStatus] = useState("loading");
          const [loadError, setLoadError] = useState("");
          const { flatCategories, count } = useParsedData(rows);
          const [active, setActive] = useState(null);
          const [detailIdx, setDetailIdx] = useState(null);
          const [isContactOpen, setIsContactOpen] = useState(false);
          const [vh, setVh] = useState(800);
          const [scale, setScale] = useState(1);
          const [query, setQuery] = useState("");
          const [fields, setFields] = useState(DEFAULT_FIELDS);
          const [submittedQuery, setSubmittedQuery] = useState("");
          const [isResultsOpen, setIsResultsOpen] = useState(false);
          const [targetTerm, setTargetTerm] = useState(null);
          const [targetTermKey, setTargetTermKey] = useState(null);
          const [targetNonce, setTargetNonce] = useState(0);
          const [isPanelClosing, setIsPanelClosing] = useState(false);
          const [isDetailLayoutActive, setIsDetailLayoutActive] = useState(false);
          const [previewLink, setPreviewLink] = useState(null);
          const [termHistory, setTermHistory] = useState([]);

          const [allLinksProgress, setAllLinksProgress] = useState(0);
          const [allLinksError, setAllLinksError] = useState("");
          const allLinksAccumRef = React.useRef({});
          const loadAllLinkedTerms = useCallback(() => {
            const arrayBuffer = workbookBufferRef.current;
            if (!arrayBuffer || allLinksStatus === "loading" || allLinksStatus === "ready") return;
            if (allLinksWorkerRef.current) {
              try { allLinksWorkerRef.current.terminate(); } catch (_) {}
              allLinksWorkerRef.current = null;
            }
            setAllLinksBySourceRaw({});
            allLinksAccumRef.current = {};
            setAllLinksProgress(0);
            setAllLinksError("");
            setAllLinksStatus("loading");

            let worker;
            try { worker=createAllLinksWorker(); } catch(err) {
              setAllLinksError(String(err && err.message || err));
              setAllLinksStatus("error");
              return;
            }
            if (!worker) {
              setAllLinksError("Web Workers are unavailable in this browser.");
              setAllLinksStatus("error");
              return;
            }
            allLinksWorkerRef.current = worker;
            const stop=()=>{
              try { worker.terminate(); } catch (_) {}
              if (allLinksWorkerRef.current === worker) allLinksWorkerRef.current=null;
            };
            worker.onmessage = event => {
              const data=event.data||{};
              if (data.type === "batch") {
                for (const link of (data.links||[])) {
                  const map=allLinksAccumRef.current;
                  if (!map[link.sourceKey]) map[link.sourceKey]=[];
                  map[link.sourceKey].push(link);
                }
              } else if (data.type === "progress") {
                setAllLinksProgress(data.count || 0);
              } else if (data.type === "done") {
                if (!data.count) {setAllLinksError("No links were parsed from the sheet.");setAllLinksStatus("error");stop();return;}
                const grouped=allLinksAccumRef.current;
                for (const arr of Object.values(grouped)) arr.sort((a,b)=>(a.rank||999999)-(b.rank||999999));
                setAllLinksBySourceRaw(grouped);
                setAllLinksProgress(data.count || 0);
                setAllLinksStatus("ready");
                stop();
              } else if (data.type === "error") {
                console.error("All linked terms loading failed:",data.message);
                setAllLinksError(data.message||"Unknown error");
                setAllLinksStatus("error");
                stop();
              }
            };
            worker.onerror = err => {
              console.error("All linked terms worker error",err);
              setAllLinksError(err.message||"Worker error. Check the browser console.");
              setAllLinksStatus("error");
              stop();
            };
            // Keep the original buffer so an interrupted transfer can be retried.
            const workerBuffer=arrayBuffer.slice(0);
            worker.postMessage({arrayBuffer:workerBuffer},[workerBuffer]);
          }, [allLinksStatus]);

          useEffect(() => () => {
            if (allLinksWorkerRef.current) {
              try { allLinksWorkerRef.current.terminate(); } catch (_) {}
              allLinksWorkerRef.current = null;
            }
          }, []);

          /* 启动时读取同目录下的 mmd.xlsx */
          useEffect(() => {
            let cancelled = false;

            (async () => {
              /* Local file:// cannot fetch adjacent files due to browser security; use the file chooser. */
              if (IS_LOCAL_FILE) {
                setLoadStatus("await-file");
                return;
              }

              let lastError = "";
              for (const candidate of DATA_CANDIDATES) {
                const url = `${candidate}?v=${DATA_VERSION}`;
                try {
                  const res = await fetch(url);
                  if (!res.ok) { lastError = `${candidate} → HTTP ${res.status}`; continue; }
                  const arrayBuffer = await res.arrayBuffer();
                  const parsed = await parseInitialWorkbook(arrayBuffer);
                  if (cancelled) return;
                  if (!parsed.rows || !parsed.rows.length) { lastError = `${candidate} → no usable rows`; continue; }
                  setRows(parsed.rows);
                  setRecommendedLinks(parsed.recommendedLinks || []);
                  workbookBufferRef.current = arrayBuffer;
                  setAllLinksBySourceRaw({});
                  setAllLinksStatus("idle");
                  setLoadStatus("ready");
                  return;
                } catch (err) {
                  lastError = `${candidate} → ${err && err.message ? err.message : err}`;
                  console.warn("Failed to load", url, err);
                }
              }

              if (!cancelled) {
                setLoadError(lastError);
                setLoadStatus("error");
              }
            })();

            return () => { cancelled = true; };
          }, []);

          /* 备用入口：本地双击打开时浏览器禁止读取同目录文件，改为手动选择 */
          const handleFileSelect = (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            setLoadStatus("loading");
            const reader = new FileReader();
            reader.onload = async (e) => {
              try {
                const arrayBuffer = e.target.result;
                const parsed = await parseInitialWorkbook(arrayBuffer);
                if (!parsed.rows || !parsed.rows.length) throw new Error("no usable rows");
                setRows(parsed.rows);
                setRecommendedLinks(parsed.recommendedLinks || []);
                workbookBufferRef.current = arrayBuffer;
                setAllLinksBySourceRaw({});
                setAllLinksStatus("idle");
                setLoadStatus("ready");
              } catch (err) {
                console.error("Failed to parse the selected file:", err);
                setLoadStatus("error");
              }
            };
            reader.onerror = () => setLoadStatus("error");
            reader.readAsArrayBuffer(file);
          };

          useEffect(() => {
            const update = () => {
              const w = window.innerWidth || BASE_WIDTH;
              const innerH = window.innerHeight || 800;
              const k = computeScale(w, innerH);
              setScale(k);
              document.documentElement.style.setProperty("--scale", String(k));
              setVh(Math.round(innerH / k));
            };
            update();
            window.addEventListener("resize", update);
            return () => window.removeEventListener("resize", update);
          }, []);

          useEffect(() => {
            if (active || isContactOpen) {
              document.body.style.overflow = 'hidden';
            } else {
              document.body.style.overflow = '';
            }
            return () => {
              document.body.style.overflow = '';
            };
          }, [active, isContactOpen]);

          const searchIndex = useMemo(() => buildSearchIndex(flatCategories), [flatCategories]);


          const groupColors = useMemo(() => {
            const colors = {};
            flatCategories.forEach(c => { if (c.group && !colors[c.group]) colors[c.group] = c.color; });
            return colors;
          }, [flatCategories]);

          const termLookup = useMemo(() => {
            const lookup = {};
            flatCategories.forEach(c => {
              (c.subs || []).forEach((s, si) => {
                (s.items || []).forEach((it) => {
                  const key = it.termKey || makeTermKey(c.group, c.name, s.label, it.term);
                  const firstPU = (it.processingUnits || [])[0] || {};
                  lookup[key] = {
                    termKey: key,
                    ci: c.ci,
                    subIdx: si,
                    term: it.term,
                    termZh: it.termZh,
                    group: c.group,
                    category: c.name,
                    subcategory: s.label,
                    color: c.color,
                    definition: firstPU.whatItIs || ""
                  };
                });
              });
            });
            return lookup;
          }, [flatCategories]);

          const enrichLink = useCallback((link) => {
            const meta = termLookup[link.targetKey];
            const targetColor = (meta && meta.color) || groupColors[link.targetGroup] || "#e2e8f0";
            return Object.assign({}, link, {
              targetColor,
              targetTermZh: (meta && meta.termZh) || link.targetTermZh,
              definition: (meta && meta.definition) || ""
            });
          }, [termLookup, groupColors]);

          const buildLinksBySource = useCallback((links) => {
            const grouped = {};
            (links || []).forEach(link => {
              if (!link.sourceKey) return;
              if (!grouped[link.sourceKey]) grouped[link.sourceKey] = [];
              grouped[link.sourceKey].push(enrichLink(link));
            });
            Object.keys(grouped).forEach(key => {
              grouped[key].sort((a, b) => (a.rank || 999999) - (b.rank || 999999));
            });
            return grouped;
          }, [enrichLink]);

          const recommendedLinksBySource = useMemo(
            () => buildLinksBySource(recommendedLinks),
            [recommendedLinks, buildLinksBySource]
          );

          const allLinksReady = allLinksStatus === "ready";

          const getAllLinksForSource = useCallback((termKey) => {
            const links = allLinksBySourceRaw[termKey] || [];
            return links.map(enrichLink);
          }, [allLinksBySourceRaw, enrichLink]);

          const suggestions = useMemo(() => {
            if (!query.trim()) return [];
            const nameFields = { category: fields.category, subcategory: fields.subcategory, term: fields.term };
            return runSearch(searchIndex, query, nameFields, 8);
          }, [searchIndex, query, fields.category, fields.subcategory, fields.term]);

          const results = useMemo(() => {
            if (!submittedQuery.trim()) return [];
            return runSearch(searchIndex, submittedQuery, fields, 0);
          }, [searchIndex, submittedQuery, fields]);

          const hitsByCategory = useMemo(() => {
            const counts = {};
            results.forEach(r => { counts[r.ci] = (counts[r.ci] || 0) + 1; });
            return counts;
          }, [results]);

          const isFiltering = submittedQuery.trim().length > 0;


          const addTermToHistory = useCallback((info) => {
            if (!info || !info.termKey) return;
            setTermHistory(prev => {
              const item = {
                termKey: info.termKey,
                term: info.term,
                termZh: info.termZh,
                category: info.category,
                subcategory: info.subcategory,
                color: info.color,
                ci: info.ci,
                subIdx: info.subIdx
              };
              const next = [item, ...prev.filter(x => x.termKey !== item.termKey)];
              return next.slice(0, 40);
            });
          }, []);

          const openTermByInfo = useCallback((info, recordHistory = true) => {
            if (!info) return false;
            const meta = info.termKey ? (termLookup[info.termKey] || info) : info;
            if (meta.ci === undefined || meta.subIdx === undefined || !meta.term) return false;
            setActive({ ci: meta.ci });
            setDetailIdx(meta.subIdx);
            setTargetTerm(meta.term || null);
            setTargetTermKey(meta.termKey || null);
            setTargetNonce(n => n + 1);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(true);
            setIsResultsOpen(false);
            if (recordHistory) addTermToHistory(meta);
            return true;
          }, [termLookup, addTermToHistory]);

          const openPreviewLink = useCallback(() => {
            if (!previewLink) return;
            const meta = termLookup[previewLink.targetKey];
            const fallback = {
              termKey: previewLink.targetKey,
              term: previewLink.targetTerm,
              termZh: previewLink.targetTermZh,
              category: previewLink.targetCategory,
              subcategory: previewLink.targetSubCategory,
              color: previewLink.targetColor
            };
            const opened = openTermByInfo(meta || fallback, true);
            if (opened) setPreviewLink(null);
          }, [previewLink, termLookup, openTermByInfo]);

          const jumpTo = (entry) => {
            setActive({ ci: entry.ci });
            setDetailIdx(entry.subIdx === null || entry.subIdx === undefined ? null : entry.subIdx);
            setTargetTerm(entry.term || null);
            setTargetTermKey(entry.termKey || null);
            if (entry.termKey) setTargetNonce(n => n + 1);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(entry.subIdx !== null && entry.subIdx !== undefined);
            setIsResultsOpen(false);
          };

          const submitSearch = () => {
            const q = query.trim();
            setSubmittedQuery(q);
            setIsResultsOpen(!!q);
          };

          const clearSearch = () => {
            setQuery("");
            setSubmittedQuery("");
            setIsResultsOpen(false);
            setTargetTerm(null);
            setTargetTermKey(null);
          };

          const openCategory = (ci) => {
            setActive({ ci });
            setTargetTerm(null);
            setTargetTermKey(null);
            setDetailIdx(null);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(false);
          };

          const closeOverlay = () => {
            setActive(null);
            setDetailIdx(null);
            setIsPanelClosing(false);
            setIsDetailLayoutActive(false);
          };

          const closeTermPanelWithAnimation = () => {
            if (detailIdx === null) return;
            setIsDetailLayoutActive(false);
            setIsPanelClosing(true);
            setTimeout(() => {
              setDetailIdx(null);
              setIsPanelClosing(false);
            }, 300);
          };

          const handleOverlayClick = () => {
            if (detailIdx !== null) {
              closeTermPanelWithAnimation();
            } else {
              closeOverlay();
            }
          };

          useEffect(() => {
            const handleKey = (e) => {
              if (e.key === 'Escape') {
                if (isResultsOpen) {
                  e.preventDefault();
                  setIsResultsOpen(false);
                } else if (active && detailIdx !== null) {
                  e.preventDefault();
                  closeTermPanelWithAnimation();
                } else if (active) {
                  e.preventDefault();
                  closeOverlay();
                } else if (isContactOpen) {
                  e.preventDefault();
                  setIsContactOpen(false);
                }
              }
            };
            window.addEventListener('keydown', handleKey);
            return () => window.removeEventListener('keydown', handleKey);
          }, [active, detailIdx, isContactOpen, isResultsOpen]);

          const CategoryCard = ({ c, ci }) => {
              const textColor = getTextColorForBackground(c.color);
              const hitCount = hitsByCategory[c.ci] || 0;
              const dimmed = isFiltering && hitCount === 0;

              return (
                <div
                    role="button"
                    tabIndex={0}
                    onMouseDown={markPointerDown}
                    onClick={(e) => { if (isDragOrSelection(e)) return; openCategory(ci); }}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCategory(ci); }
                    }}
                    className={`w-full text-left relative cursor-pointer ${dimmed ? 'card-dimmed' : ''}`}
                    aria-label={`open ${c.name} overlay`}
                >
                    {isFiltering && hitCount > 0 && (
                        <span className="card-hit-badge">{hitCount}</span>
                    )}
                    <div
                        className="category-card-base rounded-xl px-4 py-1.5 shadow-lg ring-1 ring-black/10 transition hover:shadow-2xl focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-white flex items-center justify-center text-center"
                        style={{ background: c.color, color: textColor }}
                        title={`Group: ${c.group} / Category: ${c.name} ${c.nameZh || ''}`}
                    >
                        <div className="w-full">
                            <Bi
                                en={c.name}
                                zh={c.nameZh}
                                enClass="text-[12px] font-semibold leading-tight break-words line-clamp-2"
                                zhClass="font-medium leading-tight break-words line-clamp-1 opacity-90 mt-0.5"
                                zhStyle={{ fontSize: fitZhCardSize(c.nameZh) }}
                            />
                        </div>
                    </div>
                </div>
              );
          };

          const EmptyCard = () => (
              <div
                  className="category-card-base rounded-2xl p-4 transition"
                  style={{ opacity: 0 }}
              />
          );

          /* 结尾的空位：虚线浅灰框，明确不可点击，
             提示 MMD 可以继续接纳新出现的研究领域 */
          const PlaceholderCard = () => (
              <div
                  className="category-card-base rounded-xl flex items-center justify-center text-center select-none"
                  style={{
                      background: '#ffffff',
                      border: '2px dashed #dbe1e8',
                      color: '#cbd5e1',
                      cursor: 'default',
                      pointerEvents: 'none'
                  }}
                  aria-hidden="true"
              >
                  <div className="text-xl font-light leading-none">+</div>
              </div>
          );

          const renderPage1 = () => {
            if (loadStatus === "loading") {
              return (
                <div className="main-container-width flex flex-col items-center justify-center gap-3 py-32 text-slate-500">
                  <div className="text-lg font-semibold text-slate-700">Loading the Mega-Map of Design…</div>
                  <div className="text-sm">Reading {DATA_FILE}</div>
                </div>
              );
            }

            /* 本地双击打开：先请用户选择 mmd.xlsx；选错文件时给出提示并可重选 */
            if (IS_LOCAL_FILE && (loadStatus === "await-file" || loadStatus === "error")) {
              return (
                <div className="main-container-width flex flex-col items-center justify-center gap-4 py-32 text-slate-500">
                  {loadStatus === "error" ? (
                    <div className="text-center flex flex-col items-center gap-3">
                      <div className="text-lg font-semibold text-slate-700 mb-1">Could not load data</div>
                      <div className="text-sm">Could not parse the selected file. Please make sure it is the MMD xlsx data file.</div>
                      <label className="mt-2 cursor-pointer inline-block px-5 py-2.5 rounded-xl bg-[#2867A0] text-white text-sm font-medium hover:opacity-90 transition">
                        Choose MMD xlsx
                        <input type="file" accept=".xlsx" className="hidden" onChange={handleFileSelect} />
                      </label>
                    </div>
                  ) : (
                    <div className="text-center flex flex-col items-center gap-4">
                      <div className="text-sm max-w-md">Please choose the accompanying <span className="font-medium">MMD xlsx</span> data file.</div>
                      <label className="mt-1 cursor-pointer inline-block px-6 py-3 rounded-xl bg-[#2867A0] text-white text-sm font-semibold hover:opacity-90 transition shadow-sm">
                        Choose MMD xlsx
                        <input type="file" accept=".xlsx" className="hidden" onChange={handleFileSelect} />
                      </label>
                    </div>
                  )}
                </div>
              );
            }

            if (loadStatus === "error" || flatCategories.length === 0) {
              return (
                <div className="main-container-width flex flex-col items-center justify-center gap-3 py-32 text-slate-500">
                  <div className="text-lg font-semibold text-slate-700">Could not load {DATA_FILE}</div>
                  <div className="text-sm text-center max-w-lg">
                    This page reads {DATA_FILE} and needs to be opened through a web server or GitHub
                    Pages. Check that the workbook sits in the data folder next to index.html and that its
                    name matches exactly, including capitalisation.
                  </div>
                  {loadError && (
                    <div className="text-xs text-slate-400 text-center max-w-lg break-all">{loadError}</div>
                  )}
                  <label className="mt-2 cursor-pointer rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                    Select {DATA_FILE}
                    <input type="file" accept=".xlsx,.xls" className="hidden" onChange={handleFileSelect} />
                  </label>
                </div>
              );
            }

            /* 取消 Layer 分层，全部 Category 按原表顺序平铺
               行长 6 / 5 交替（原 Layer 3 的排列方式），偶数行反向排列 */
            /* 队尾追加一块占位卡片，随 Category 数量一起流动 */
            const entries = flatCategories.map(c => ({ type: 'category', c }));
            entries.push({ type: 'placeholder' });

            const blocks = [];
            let cursor = 0;
            let isOddRow = true;
            while (cursor < entries.length) {
              const size = isOddRow ? 6 : 5;
              blocks.push({
                items: entries.slice(cursor, cursor + size),
                size,
                isOddRow
              });
              cursor += size;
              isOddRow = !isOddRow;
            }

            return (
                <div className="main-container-width pt-2">
                    {blocks.map((block, index) => {
                        const gridClass = block.isOddRow ? 'grid-6-centered' : 'grid-5-centered';
                        const cards = block.items.map((entry, k) => (
                            entry.type === 'category'
                                ? <CategoryCard key={entry.c.key} c={entry.c} ci={entry.c.ci} />
                                : <PlaceholderCard key={`placeholder-${index}-${k}`} />
                        ));
                        if (!block.isOddRow) cards.reverse();

                        const padCount = block.size - block.items.length;
                        const pads = Array.from({ length: padCount }).map((_, k) => (
                            <EmptyCard key={`empty-${index}-${k}`} />
                        ));

                        return (
                            <div key={`row-${index}`} className={`w-full mb-[7px] ${gridClass}`}>
                                {block.isOddRow ? [...cards, ...pads] : [...pads, ...cards]}
                            </div>
                        );
                    })}
                </div>
            );
          };

          return (
            <div className="min-h-screen w-full bg-white text-slate-800" style={{ zoom: scale }}>

              <div className="sticky top-0 z-20 bg-white/95 backdrop-blur-sm border-b border-slate-100">
                <div className="main-container-width pt-3 pb-0 flex flex-col items-center">

                  <div className="absolute top-3 left-5">
                      <span className="mmd-gradient text-base">
                          MMD
                      </span>
                  </div>

                  <div className="absolute top-3 right-5 flex items-center gap-2">
                      <button
                          onClick={loadAllLinkedTerms}
                          disabled={loadStatus !== "ready" || allLinksStatus === "loading" || allLinksStatus === "ready" || !workbookBufferRef.current}
                          className={`text-xs font-medium border px-3 py-1 rounded-lg transition ${
                            allLinksStatus === "ready"
                              ? "border-emerald-300 text-emerald-700 bg-emerald-50 cursor-default"
                              : allLinksStatus === "loading"
                                ? "border-slate-300 text-slate-500 bg-slate-50 cursor-wait"
                                : "border-slate-300 text-slate-700 hover:bg-slate-50"
                          }`}
                          title={allLinksStatus === "error" ? `Load failed: ${allLinksError}. Click to retry.` : allLinksStatus === "ready" ? "All linked terms are loaded" : "Load the complete linked-term list"}
                      >
                          {allLinksStatus === "loading"
                            ? `Loading all linked terms… ${allLinksProgress.toLocaleString()} / ~533,882`
                            : allLinksStatus === "ready"
                              ? "All linked terms loaded"
                              : allLinksStatus === "error"
                                ? "Retry loading all linked terms"
                                : "Load all linked terms"}
                      </button>
                      <button
                          onClick={() => setIsContactOpen(true)}
                          className="text-xs font-medium border border-slate-300 px-3 py-1 rounded-lg text-slate-700 hover:bg-slate-50 transition"
                      >
                          Contact Us
                      </button>
                  </div>

                  <h1 className="text-xl font-extrabold text-slate-900 mb-2">
                    Mega-Map of Design
                  </h1>

                  <SearchBar
                    query={query}
                    setQuery={setQuery}
                    fields={fields}
                    setFields={setFields}
                    suggestions={suggestions}
                    onPick={jumpTo}
                    onSubmit={submitSearch}
                    onClear={clearSearch}
                    hasResults={isFiltering}
                    resultCount={results.length}
                  />
                </div>
              </div>

              <ContactDrawer
                  isOpen={isContactOpen}
                  onClose={() => setIsContactOpen(false)}
              />

              {isResultsOpen && (
                <SearchResultsPanel
                  query={submittedQuery}
                  results={results}
                  onPick={jumpTo}
                  onClose={() => setIsResultsOpen(false)}
                />
              )}

              <HistoryPanel items={termHistory} onPick={(item) => openTermByInfo(item, true)} />

              {previewLink && (
                <LinkedTermPreview
                  link={previewLink}
                  onClose={() => setPreviewLink(null)}
                  onOpen={openPreviewLink}
                />
              )}

              {renderPage1()}

              {active && (() => {
                  const C = flatCategories[active.ci];
                  if (!C) return null;

                  const subs = C.subs || [];
                  const CENTER_H = LIST_CATEGORY_HEIGHT + 30;
                  const CENTER_W = Math.round(CENTER_H * LIST_CATEGORY_ASPECT_RATIO);
                  const ellipseShiftX = isDetailLayoutActive ? -160 : 0;
                  const centerShiftX = isDetailLayoutActive ? -160 : 0;

                  const { positions: POS, subW, subH } = getFixedPositionsRect(CENTER_W, CENTER_H);

                  const maxSlots = POS.length;
                  const usedCount = Math.min(subs.length, maxSlots);
                  let ringOrder = [];
                  if (maxSlots > 0) {
                    let maxX = -Infinity;
                    for (let i = 0; i < maxSlots; i++) {
                      if (POS[i].x > maxX) maxX = POS[i].x;
                    }
                    const indexed = POS.map((p, idx) => ({ idx, x: p.x, y: p.y }));
                    indexed.sort((a, b) => {
                      const da = Math.abs(a.x - maxX);
                      const db = Math.abs(b.x - maxX);
                      if (da !== db) return da - db;
                      if (a.y !== b.y) return a.y - b.y;
                      return a.idx - b.idx;
                    });
                    ringOrder = indexed.map(p => p.idx);
                  }
                  const usedIndices = ringOrder.slice(0, usedCount);

                  const centerTextColor = getTextColorForBackground(C.color);

                  return (
                    <div
                      className="fullscreen-layer z-30 bg-slate-900/70 backdrop-blur-sm"
                      onClick={handleOverlayClick}
                    >
                      <div className="flex items-center justify-center w-full h-full p-6">
                        <div
                          className="relative w-full max-w-7xl"
                          style={{ height: Math.round(vh * 0.8) }}
                        >
                          <div className="w-full h-full flex gap-6">

                            <div className="w-[65%] h-full relative">
                              <div className="absolute inset-0">

                                <div
                                  className="absolute rounded-3xl shadow-2xl ring-2 ring-white/70 flex items-center justify-center text-center p-4 cursor-default transition-all duration-300 ease-out"
                                  style={{
                                    width: CENTER_W,
                                    height: CENTER_H,
                                    left: `calc(50% + ${centerShiftX}px)`,
                                    top: '50%',
                                    transform: `translate(-50%, -50%)`,
                                    background: C.color,
                                    color: centerTextColor,
                                    userSelect: 'text'
                                  }}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                  }}
                                >
                                  <div className="max-w-[11rem]">
                                    <Bi
                                      en={C.name}
                                      zh={C.nameZh}
                                      enClass="text-base font-semibold leading-tight break-words"
                                      zhClass="text-[17px] font-medium leading-tight break-words opacity-90 mt-1"
                                    />
                                  </div>
                                </div>

                                {Array.from({ length: usedCount }).map((_, idx) => {
                                  const sub = subs[idx];
                                  const posIndex = usedIndices[idx];
                                  const p = POS[posIndex];

                                  const isSelected = detailIdx === idx;
                                  const isActive = (isDetailLayoutActive || isPanelClosing) && isSelected;

                                  const subBg = lightenHex(C.color, 50);
                                  const subTextColor = getTextColorForBackground(subBg);
                                  const borderWidth = isActive ? 6 : 3;
                                  const subBoxShadow = `0 0 0 ${borderWidth}px rgba(255,255,255,0.7), 0 8px 22px rgba(15,23,42,0.35)`;

                                  return (
                                    <div
                                      key={idx}
                                      role="button"
                                      tabIndex={0}
                                      onMouseDown={markPointerDown}
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        if (isDragOrSelection(e)) return;
                                        if (detailIdx === null) {
                                          setDetailIdx(idx);
                                          setIsPanelClosing(false);
                                          setIsDetailLayoutActive(true);
                                        } else if (detailIdx !== idx) {
                                          setDetailIdx(idx);
                                          setIsPanelClosing(false);
                                          setIsDetailLayoutActive(true);
                                        }
                                      }}
                                      className="absolute rounded-xl shadow-lg ring-1 ring-black/10 text-center flex items-center justify-center transition-all duration-300 ease-out"
                                      style={{
                                        width: subW,
                                        height: subH,
                                        left: `calc(50% + ${p.x + ellipseShiftX}px)`,
                                        top: `calc(50% + ${p.y}px)`,
                                        transform: 'translate(-50%, -50%)',
                                        background: subBg,
                                        color: subTextColor,
                                        boxShadow: subBoxShadow,
                                        opacity:
                                          (isDetailLayoutActive || isPanelClosing) && detailIdx !== null && !isSelected
                                            ? 0.4
                                            : 1,
                                        userSelect: 'text',
                                        cursor: isSelected ? 'default' : 'pointer',
                                        zIndex: isActive ? 30 : 10
                                      }}
                                    >
                                      <FitBox className="px-2 py-1.5">
                                        <Bi
                                          en={sub?.label || "Subcategory"}
                                          zh={sub?.labelZh}
                                          enClass="text-[13px] font-medium leading-tight break-words"
                                          zhClass="text-[14px] font-medium leading-tight break-words opacity-90 mt-0.5"
                                        />
                                      </FitBox>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>

                            <div className="w-[35%] h-full flex items-center justify-end">
                              {detailIdx !== null && (() => {
                                const s = subs[detailIdx] || { label: 'No Subcategory', items: [] };
                                const items = s.items;

                                const panelBg = lightenHex(C.color, 50);
                                const panelTextColor = getTextColorForBackground(panelBg);
                                const panelBoxShadow = '0 0 0 6px rgba(255,255,255,0.7), 0 8px 22px rgba(15,23,42,0.35)';

                                return (
                                  <div
                                     key={`${C.ci}-${detailIdx}`}
                                     className={`term-panel-wrapper ${isPanelClosing ? 'term-panel-exit' : 'term-panel-enter'}`}
                                     style={{ height: '90%', width: '100%', padding: '6px', boxSizing: 'border-box' }}
                                     onClick={(e) => e.stopPropagation()}
                                  >
                                    <div
                                      className="rounded-3xl w-full h-full overflow-hidden transition-all ease-out shadow-lg ring-1 ring-black/10"
                                      style={{
                                          background: panelBg,
                                          color: panelTextColor,
                                          userSelect: 'text',
                                          boxShadow: panelBoxShadow,
                                      }}
                                    >
                                      {/* 标题 + 横线 */}
                                      <div
                                        className="px-5 pt-3 pb-2"
                                        style={{
                                               borderBottom: `1px solid ${hexToRgba(panelTextColor, 0.4)}`
                                        }}
                                      >
                                        <div className="pr-4" style={{ color: panelTextColor }}>
                                            <Bi
                                                en={s.label || 'Subcategory Detail'}
                                                zh={s.labelZh}
                                                enClass="text-base font-bold leading-snug"
                                                zhClass="text-xs font-semibold leading-snug opacity-90"
                                            />
                                        </div>
                                      </div>

                                      {/* 内容区域 */}
                                      <div className="px-5 py-4 overflow-y-auto pb-10 term-panel-content" style={{ height: 'calc(100% - 54px)' }}>
                                        {items.length > 0 ? (
                                          items.map((it, i) => (
                                            <TermItem
                                              key={it.termKey || i}
                                              it={it}
                                              panelTextColor={panelTextColor}
                                              borderColor={hexToRgba(panelTextColor, 0.3)}
                                              isTarget={!!targetTermKey && it.termKey === targetTermKey}
                                              targetTermKey={targetTermKey}
                                              targetNonce={targetNonce}
                                              recommendedLinks={recommendedLinksBySource[it.termKey] || []}
                                              allLinks={allLinksReady ? getAllLinksForSource(it.termKey) : []}
                                              allLinksReady={allLinksReady}
                                              onPreviewLink={setPreviewLink}
                                              onVisitTerm={addTermToHistory}
                                              meta={termLookup[it.termKey] || {
                                                termKey: it.termKey,
                                                ci: C.ci,
                                                subIdx: detailIdx,
                                                term: it.term,
                                                termZh: it.termZh,
                                                group: C.group,
                                                category: C.name,
                                                subcategory: s.label,
                                                color: C.color
                                              }}
                                            />
                                          ))
                                        ) : (
                                          <div className="text-center text-base opacity-80 pt-10">
                                              此 Subcategory 暂无 Term 或 Subterm 数据。
                                          </div>
                                        )}
                                        <div className="h-10" />
                                      </div>
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>

                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })()}


            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DesignMapPage />);
    </script>
</body>
</html>
